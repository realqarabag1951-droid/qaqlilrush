<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>QAQLIL RUSH</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 20% 10%,
            #293f91 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 80%,
            #711653 0%,
            transparent 35%
        ),
        #070a12;

    overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

header{
    width:min(1100px,100%);

    margin:auto;

    padding:
        15px
        15px
        10px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.logo{
    font-size:
        clamp(
            27px,
            7vw,
            44px
        );

    font-weight:1000;

    letter-spacing:2px;

    text-shadow:
        0 4px 20px #0008;
}

.logo span{
    color:#39ff70;
}

.status{
    display:flex;

    align-items:center;

    gap:7px;

    padding:
        9px
        13px;

    background:#0c1320;

    border:
        1px solid
        #33415f;

    border-radius:14px;

    color:#9da9bc;

    font-size:13px;

    font-weight:800;
}

.statusDot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#39ff70;

    box-shadow:
        0 0 12px #39ff70;
}


/* =========================
   GAME CONTAINER
========================= */

.gameWrap{
    width:min(1100px,100%);

    margin:auto;

    padding:
        0
        12px;
}

.gameCard{
    position:relative;

    width:100%;

    overflow:hidden;

    border:
        1px solid
        #34415e;

    border-radius:22px;

    background:#090d16;

    box-shadow:
        0 25px 80px #000a;
}


/* =========================
   HUD
========================= */

.hud{
    height:56px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0
        17px;

    background:
        linear-gradient(
            180deg,
            #101827,
            #090e18
        );

    border-bottom:
        1px solid
        #26334b;

    position:relative;

    z-index:5;
}

.hudItem{
    display:flex;

    align-items:center;

    gap:7px;

    color:#a9b5c9;

    font-size:13px;

    font-weight:800;
}

.hudValue{
    color:#39ff70;

    font-size:18px;

    font-weight:1000;
}

.hudRecord{
    color:#2ddcff;
}


/* =========================
   CANVAS
========================= */

canvas{
    display:block;

    width:100%;

    height:auto;

    background:#111827;

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;
}


/* =========================
   GAME OVER
========================= */

.gameOver{
    position:absolute;

    top:56px;
    left:0;
    right:0;
    bottom:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:#03050bcc;

    backdrop-filter:
        blur(4px);

    z-index:20;
}

.gameOver.show{
    display:flex;
}

.gameOverBox{
    width:min(380px,90%);

    padding:28px;

    text-align:center;

    border:
        1px solid
        #465675;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #111827,
            #090d16
        );

    box-shadow:
        0 25px 80px #000d;
}

.gameOverTitle{
    font-size:31px;

    font-weight:1000;

    color:#ff4c91;

    margin-bottom:5px;
}

.gameOverSub{
    color:#929eb2;

    font-size:14px;
}

.finalDistance{
    margin:
        8px
        0;

    font-size:50px;

    font-weight:1000;

    color:#2ddcff;
}

.newRecord{
    min-height:25px;

    color:#39ff70;

    font-weight:1000;

    margin-bottom:12px;
}


/* =========================
   BUTTONS
========================= */

.controls{
    width:min(1100px,100%);

    margin:auto;

    padding:
        10px
        12px
        0;
}

.restart{
    width:100%;

    padding:15px;

    border:0;

    border-radius:14px;

    background:
        linear-gradient(
            90deg,
            #39ff70,
            #2ddcff
        );

    color:#06100d;

    font-size:16px;

    font-weight:1000;

    box-shadow:
        0 8px 30px #0005;

    transition:
        transform .12s ease,
        filter .12s ease;
}

.restart:active{
    transform:scale(.98);

    filter:brightness(.9);
}


/* =========================
   TIP
========================= */

.tip{
    width:min(1100px,100%);

    margin:auto;

    padding:
        10px
        15px;

    text-align:center;

    color:#8f9bad;

    font-size:12px;
}

.tip b{
    color:#dce5f2;
}


/* =========================
   FOOTER
========================= */

footer{
    width:min(1100px,100%);

    margin:auto;

    padding:
        24px
        15px
        18px;

    text-align:center;

    color:#7f8b9e;

    font-size:13px;
}

footer a{
    color:#2ddcff;

    font-weight:900;

    text-decoration:none;
}

footer a:hover{
    text-decoration:underline;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        padding:
            12px
            10px
            8px;
    }

    .logo{
        font-size:27px;
    }

    .status{
        font-size:11px;

        padding:
            8px
            10px;
    }

    .hud{
        height:48px;

        padding:
            0
            11px;
    }

    .hudItem{
        font-size:10px;
    }

    .hudValue{
        font-size:15px;
    }

    .gameCard{
        border-radius:16px;
    }

    .gameOver{
        top:48px;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">
        QAQLIL <span>RUSH</span>
    </div>

    <div class="status">
        <span class="statusDot"></span>
        ONLINE GAME
    </div>

</header>


<div class="gameWrap">

    <div class="gameCard">

        <div class="hud">

            <div class="hudItem">
                📏
                MƏSAFƏ:
                <span
                    id="distance"
                    class="hudValue"
                >
                    0
                </span>
                M
            </div>

            <div class="hudItem">
                🏆
                REKORD:
                <span
                    id="best"
                    class="hudValue hudRecord"
                >
                    0
                </span>
                M
            </div>

        </div>


        <canvas
            id="gameCanvas"
            width="1000"
            height="560"
        ></canvas>


        <div
            id="gameOver"
            class="gameOver"
        >

            <div class="gameOverBox">

                <div class="gameOverTitle">
                    OYUN BİTDİ
                </div>

                <div class="gameOverSub">
                    Maneəyə toxundun!
                </div>

                <div
                    id="finalDistance"
                    class="finalDistance"
                >
                    0 M
                </div>

                <div
                    id="newRecord"
                    class="newRecord"
                ></div>

                <button
                    id="restartButton"
                    class="restart"
                    type="button"
                >

            </div>

    </div>

</div>


<div class="controls">

    <button
        id="restartBottom"
        class="restart"
        type="button"

        ↻ RESTART
    </button>

</div>


<div class="tip">
    👆 <b>Ekrana toxun</b> — tullanmısan &nbsp;•&nbsp;
    ⌨️ <b>SPACE</b> — tullanmısan
</div>


<footer>

    QAQLIL RUSH © 2026

    <br><br>

    <a
        href="https://www.tiktok.com/@ssamirreds"
        target="_blank"
        rel="noopener noreferrer"
    >

    </a>

</footer>


<script>

"use strict";


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


/* =====================================================
   UI
===================================================== */

const distanceElement =
    document.getElementById(
        "distance"
    );

const bestElement =
    document.getElementById(
        "best"
    );

const gameOverElement =
    document.getElementById(
        "gameOver"
    );

const finalDistanceElement =
    document.getElementById(
        "finalDistance"
    );

const newRecordElement =
    document.getElementById(
        "newRecord"
    );

const restartButton =
    document.getElementById(
        "restartButton"
    );

const restartBottom =
    document.getElementById(
        "restartBottom"
    );


/* =====================================================
   GAME VARIABLES
===================================================== */

const W = 1000;
const H = 560;

const groundY = 455;

let player;

let obstacles = [];

let particles = [];

let clouds = [];

let mountains = [];

let distance = 0;

let best =
    Number(
        localStorage.getItem(
            "qaqlil_best"
        ) || 0
    );

let speed = 6;

let gameRunning = true;

let lastTime = 0;

let obstacleTimer = 0;

let nextObstacle = 1000;

let worldOffset = 0;


/* =====================================================
   PLAYER
===================================================== */

function createPlayer(){

    return {

        x:145,

        y:groundY - 72,

        width:46,

        height:72,

        velocityY:0,

        gravity:0.75,

        jumpPower:-14,

        grounded:true,

        squash:1

    };

}


/* =====================================================
   CLOUDS
===================================================== */

function createClouds(){

    clouds = [];

    for(
        let i=0;
        i<9;
        i++
    ){

        clouds.push({

            x:
                Math.random()*W,

            y:
                70+
                Math.random()*150,

            size:
                35+
                Math.random()*55,

            speed:
                0.15+
                Math.random()*0.3

        });

    }

}


/* =====================================================
   MOUNTAINS
===================================================== */

function createMountains(){

    mountains = [];

    for(
        let i=0;
        i<9;
        i++
    ){

        mountains.push({

            x:i*150,

            width:
                170+
                Math.random()*100,

            height:
                80+
                Math.random()*130

        });

    }

}


/* =====================================================
   RESET GAME
===================================================== */

function restartGame(){

    player =
        createPlayer();

    obstacles = [];

    particles = [];

    distance = 0;

    speed = 6;

    obstacleTimer = 0;

    nextObstacle =
        850+
        Math.random()*650;

    worldOffset = 0;

    gameRunning = true;

    gameOverElement
        .classList
        .remove("show");

    distanceElement
        .textContent = "0";

    bestElement
        .textContent =
        Math.floor(best);

}


/* =====================================================
   JUMP
===================================================== */

function jump(){

    if(!gameRunning){

        restartGame();

        return;

    }

    if(player.grounded){

        player.velocityY =
            player.jumpPower;

        player.grounded =
            false;

        player.squash =
            0.88;

        createJumpParticles();

    }

}


/* =====================================================
   PARTICLES
===================================================== */

function createJumpParticles(){

    for(
        let i=0;
        i<7;
        i++
    ){

        particles.push({

            x:
                player.x+
                10+
                Math.random()*25,

            y:
                groundY-

                Math.random()*8,

            vx:
                -1+
                Math.random()*2,

            vy:
                -1-
                Math.random()*2,

            life:1,

            size:
                3+
                Math.random()*4

        });

    }

}


function createCrashParticles(){

    for(
        let i=0;
        i<20;
        i++
    ){

        particles.push({

            x:
                player.x+
                player.width/2,

            y:
                player.y+
                player.height/2,

            vx:
                -5+
                Math.random()*10,

            vy:
                -7+
                Math.random()*8,

            life:1,

            size:
                3+
                Math.random()*5

        });

    }

}


/* =====================================================
   OBSTACLE
===================================================== */

function createObstacle(){

    const types = [
        "rock",
        "crate",
        "cactus",
        "barrier"
    ];

    const type =
        types[
            Math.floor(
                Math.random()*
                types.length
            )
        ];


    let width;
    let height;


    if(type==="rock"){

        width =
            42+
            Math.random()*25;

        height =
            35+
            Math.random()*30;

    }

    else if(type==="crate"){

        width =
            42+
            Math.random()*15;

        height =
            45+
            Math.random()*15;

    }

    else if(type==="cactus"){

        width =
            30+
            Math.random()*15;

        height =
            65+
            Math.random()*20;

    }

    else{

        width =
            60+
            Math.random()*20;

        height =
            38+
            Math.random()*12;

    }


    obstacles.push({

        x:
            W+60,

        y:
            groundY-height,

        width,

        height,

        type

    });

}


/* =====================================================
   COLLISION
===================================================== */

function collision(a,b){

    const paddingX = 9;
    const paddingY = 7;

    return (

        a.x+
        paddingX
        <
        b.x+
        b.width-

        paddingX

        &&

        a.x+
        a.width-
        paddingX
        >
        b.x+
        paddingX

        &&

        a.y+
        paddingY
        <
        b.y+
        b.height

        &&

        a.y+
        a.height-
        paddingY
        >
        b.y+
        paddingY

    );

}


/* =====================================================
   GAME UPDATE
===================================================== */

function update(delta){

    if(!gameRunning){

        updateParticles(delta);

        return;

    }


    /*
        SPEED
    */

    speed +=
        0.0009*
        delta;

    speed =
        Math.min(
            speed,
            13
        );


    /*
        DISTANCE
    */

    distance +=
        speed*
        delta/
        100;

    distanceElement
        .textContent =
        Math.floor(distance);


    /*
        PLAYER PHYSICS
    */

    player.velocityY +=
        player.gravity*
        delta/
        16;

    player.y +=
        player.velocityY*
        delta/
        16;


    if(
        player.y+
        player.height
        >=
        groundY
    ){

        player.y =
            groundY-
            player.height;

        player.velocityY = 0;

        player.grounded =
            true;

    }
    else{

        player.grounded =
            false;

    }


    player.squash +=
        (1-player.squash)*
        0.15;


    /*
        OBSTACLES
    */

    obstacleTimer +=
        delta;


    if(
        obstacleTimer >=
        nextObstacle
    ){

        createObstacle();

        obstacleTimer = 0;

        nextObstacle =
            Math.max(
                600,
                1100-
                speed*40
            )+
            Math.random()*700;

    }


    for(
        let i=
        obstacles.length-1;
        i>=0;
        i--
    ){

        const obstacle =
            obstacles[i];

        obstacle.x -=
            speed*
            delta/
            16;


        if(
            collision(
                player,
                obstacle
            )
        ){

            endGame();

            return;

        }


        if(
            obstacle.x+
            obstacle.width
            <
            -100
        ){

            obstacles.splice(
                i,
                1
            );

        }

    }


    /*
        WORLD
    */

    worldOffset +=
        speed*
        delta/
        16;


    /*
        CLOUDS
    */

    for(
        const cloud
        of clouds
    ){

        cloud.x -=
            cloud.speed*
            delta/
            16;

        if(
            cloud.x+
            cloud.size*3
            <
            0
        ){

            cloud.x =
                W+
                100;

        }

    }


    updateParticles(delta);

}


/* =====================================================
   PARTICLES UPDATE
===================================================== */

function updateParticles(delta){

    for(
        let i=
        particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.x +=
            p.vx*
            delta/
            16;

        p.y +=
            p.vy*
            delta/
            16;

        p.vy +=
            0.25*
            delta/
            16;

        p.life -=
            0.025*
            delta/
            16;


        if(p.life<=0){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   END GAME
===================================================== */

function endGame(){

    if(!gameRunning)
        return;


    gameRunning =
        false;


    createCrashParticles();


    const final =
        Math.floor(distance);


    const isNewRecord =
        final > best;


    if(isNewRecord){

        best =
            final;

        localStorage.setItem(
            "qaqlil_best",
            best
        );

        newRecordElement
            .textContent =
            "🔥 YENİ REKORD!";

    }
    else{

        newRecordElement
            .textContent =
            "Rekord: "+
            best+
            " M";

    }


    finalDistanceElement
        .textContent =
        final+
        " M";


    bestElement
        .textContent =
        best;


    gameOverElement
        .classList
        .add("show");

}


/* =====================================================
   DRAW SKY
===================================================== */

function drawSky(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#17285d"
    );

    gradient.addColorStop(
        0.6,
        "#496da0"
    );

    gradient.addColorStop(
        1,
        "#d69a6a"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        SUN
    */

    ctx.beginPath();

    ctx.arc(
        790,
        120,
        58,
        0,
        Math.PI*2
