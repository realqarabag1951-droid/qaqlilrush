<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 15% 10%,
            #253c9c 0,
            transparent 35%
        ),

            circle at 90% 85%,
            #92145f 0,
            transparent 38%
        ),

    overflow-x:hidden;
}

button{
    font:inherit;
    cursor:pointer;
    border:0;
}

#app{
    width:min(1050px,100%);
    padding:14px;
}


/* ================================
   HEADER
================================ */

header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:14px;
}

.logo{
    font-size:
        clamp(
            28px,
            7vw,
            45px
        );

    font-weight:1000;
    letter-spacing:2px;
}

.logo span{
    color:#39ff70;
}

.bestBox{
    padding:10px 15px;

    background:#0c111d;

    border:1px solid #34405b;

    border-radius:14px;

    font-weight:900;

    font-size:14px;
}

.bestBox b{
    color:#39ff70;
}


/* ================================
   GAME CARD
================================ */

.gameCard{
    position:relative;

    overflow:hidden;

    background:#0c111d;

    border:
        1px solid
        #34405b;

    border-radius:22px;

    box-shadow:
        0 20px 70px #000b;
}

.hud{
    height:55px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        0
        16px;

    background:#090e18;

    font-weight:900;

    font-size:14px;

    position:relative;

    z-index:3;
}

.hud b{
    color:#39ff70;
}

#gameCanvas{
    display:block;

    width:100%;
    height:auto;

    background:
        linear-gradient(
            #111a38,
            #070a13
        );

    touch-action:none;

    user-select:none;
}


/* ================================
   GAME OVER
================================ */

#gameOver{
    position:absolute;

    top:55px;
    left:0;
    right:0;
    bottom:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000b;

    z-index:20;
}

.overBox{
    width:min(390px,90%);

    padding:30px;

    text-align:center;

    background:#0c111d;

    border:
        1px solid
        #485675;

    border-radius:22px;

    box-shadow:
        0 20px 70px #000d;
}

.overBox h1{
    color:#ff4c9a;

    font-size:32px;

    margin-bottom:12px;
}

.finalDistance{
    margin:8px 0 5px;

    font-size:48px;

    font-weight:1000;

    color:#2ddcff;
}

.newRecord{
    color:#39ff70;

    font-weight:1000;

    margin:
        8px
        0
        18px;

    min-height:20px;
}


/* ================================
   BUTTONS
================================ */

.controls{
    display:flex;

    gap:10px;

    margin-top:12px;
}

.control{
    flex:1;

    padding:15px;

    border-radius:14px;

    font-weight:1000;
}

.jump{
    background:
        linear-gradient(
            90deg,
            #39ff70,
            #2ddcff
        );

    color:#06100d;
}

.restart{
    background:#171f2e;

    color:white;

    border:
        1px solid
        #34405b;
}


/* ================================
   INFO
================================ */

.info{
    margin-top:12px;

    display:grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap:10px;
}

.infoBox{
    padding:15px;

    text-align:center;

    background:#0c111d;

    border:
        1px solid
        #2d3954;

    border-radius:16px;
}

.infoBox strong{
    display:block;

    font-size:20px;

    color:#2ddcff;

    margin-bottom:4px;
}

.infoBox span{
    color:#8995aa;

    font-size:12px;
}


/* ================================
   FOOTER
================================ */

footer{
    text-align:center;

    padding:
        25px
        5px
        15px;

    color:#8792a5;

    font-size:14px;
}

footer a{
    color:#2ddcff;

    text-decoration:none;

    font-weight:1000;
}

footer a:hover{
    text-decoration:underline;
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    #app{
        padding:8px;
    }

    header{
        margin-bottom:9px;
    }

    .logo{
        font-size:27px;
    }

    .bestBox{
        padding:
            8px
            11px;

        font-size:12px;
    }

    .hud{
        height:47px;

        font-size:11px;

        padding:
            0
            11px;
    }

    #gameOver{
        top:47px;
    }

    .controls{
        flex-direction:column;
    }

    .control{
        padding:14px;
    }

    .infoBox{
        padding:12px 5px;
    }

    .infoBox strong{
        font-size:17px;
    }

    .infoBox span{
        font-size:10px;
    }

}

</style>

<script>

"use strict";


/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


/* =========================================
   ELEMENTS
========================================= */

const distanceEl =
    document.getElementById(
        "distance"
    );

const speedEl =
    document.getElementById(
        "speed"
    );

const bestEl =
    document.getElementById(
        "best"
    );

const bestInfoEl =
    document.getElementById(
        "bestInfo"
    );

const obstaclesPassedEl =
    document.getElementById(
        "obstaclesPassed"
    );

const gameOverEl =
    document.getElementById(
        "gameOver"
    );

const finalDistanceEl =
    document.getElementById(
        "finalDistance"
    );

const newRecordEl =
    document.getElementById(
        "newRecord"
    );


/* =========================================
   GAME STATE
========================================= */

const W = 900;
const H = 500;

const groundY = 415;

let player;

let obstacles = [];

let particles = [];

let distance = 0;

let best =
    Number(
        localStorage.getItem(
            "qaqlil_best"
        ) || 0
    );

let obstacleCount = 0;

let gameRunning = false;

let gameOver = false;

let lastTime = 0;

let spawnTimer = 0;

let spawnDelay = 1300;

let worldSpeed = 6;

let animationId = 0;


/* =========================================
   PLAYER
========================================= */

function createPlayer(){

    return {

        x:120,

        y:groundY - 65,

        width:42,

        height:65,

        velocityY:0,

        gravity:0.8,

        jumpPower:-15,

        grounded:true

    };

}


/* =========================================
   RESET
========================================= */

function restartGame(){

    cancelAnimationFrame(
        animationId
    );

    player =
        createPlayer();

    obstacles = [];

    particles = [];

    distance = 0;

    obstacleCount = 0;

    spawnTimer = 0;

    spawnDelay = 1300;

    worldSpeed = 6;

    gameRunning = true;

    gameOver = false;

    gameOverEl.style.display =
        "none";

    updateHUD();

    lastTime =
        performance.now();

    animationId =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================
   JUMP
========================================= */

function jump(){

    if(gameOver){

        restartGame();

        return;

    }

    if(
        player &&
        player.grounded
    ){

        player.velocityY =
            player.jumpPower;

        player.grounded =
            false;

        createJumpParticles();

        beep(
            500,
            0.06
        );

    }

}


/* =========================================
   INPUT
========================================= */

document
    .getElementById(
        "jumpButton"
    )
    .addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            jump();

        }
    );


document
    .getElementById(
        "restartButton"
    )
    .addEventListener(
        "click",
        restartGame
    );


document
    .getElementById(
        "overRestart"
    )
    .addEventListener(
        "click",
        restartGame
    );


document.addEventListener(
    "keydown",
    event => {

        if(
            event.code === "Space" ||
            event.code === "ArrowUp"
        ){

            event.preventDefault();

            jump();

        }

    }
);


/* =========================================
   CANVAS TOUCH
========================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        jump();

    }
);


/* =========================================
   SPAWN OBSTACLE
========================================= */

function spawnObstacle(){

    const height =
        35 +
        Math.random() * 55;

    const width =
        25 +
        Math.random() * 28;

    obstacles.push({

        x:W + 30,

        y:groundY - height,

        width,

        height,

        passed:false,

        type:
            Math.random() >
            0.5
            ? "rock"
            : "spike"

    });

}


/* =========================================
   UPDATE
========================================= */

function update(delta){

    if(!gameRunning)
        return;


    /* PLAYER */

    player.velocityY +=
        player.gravity;

    player.y +=
        player.velocityY;


    if(
        player.y +
        player.height >=
        groundY
    ){

        player.y =
            groundY -
            player.height;

        player.velocityY =
            0;

        player.grounded =
            true;

    }


    /* SPEED */

    worldSpeed =
        6 +
        Math.min(
            distance / 500,
            8
        );


    spawnDelay =
        Math.max(
            500,
            1300 -
            distance * 0.7
        );


    /* DISTANCE */

    distance +=
        worldSpeed *
        delta *
        0.045;


    /* SPAWN */

    spawnTimer +=
        delta;

    if(
        spawnTimer >=
        spawnDelay
    ){

        spawnObstacle();

        spawnTimer = 0;

    }


    /* OBSTACLES */

    for(
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ){

        const obstacle =
            obstacles[i];

        obstacle.x -=
            worldSpeed *
            delta *
            0.06;


        if(
            !obstacle.passed &&
            obstacle.x +
            obstacle.width <
            player.x
        ){

            obstacle.passed =
                true;

            obstacleCount++;

            createScoreParticles(
                obstacle.x,
                obstacle.y
            );

        }


        if(
            obstacle.x +
            obstacle.width <
            -50
        ){

            obstacles.splice(
                i,
                1
            );

            continue;

        }


        if(
            collision(
                player,
                obstacle
            )
        ){

            endGame();

            return;

        }

    }


    /* PARTICLES */

    updateParticles();


    updateHUD();

}


/* =========================================
   COLLISION
========================================= */

function collision(
    a,
    b
){

    const padding = 8;

    return (

        a.x + padding <
        b.x + b.width &&

        a.x +
        a.width -
        padding >
        b.x &&

        a.y + padding <
        b.y + b.height &&

        a.y +
        a.height -
        padding >
        b.y

    );

}


/* =========================================
   END GAME
========================================= */

function endGame(){

    gameRunning =
        false;

    gameOver =
        true;

    const final =
        Math.floor(
            distance
        );

    const newRecord =
        final > best;


    if(newRecord){

        best =
            final;

        localStorage.setItem(
            "qaqlil_best",
            best
        );

        newRecordEl.textContent =
            "🏆 YENİ REKORD!";

    }else{

        newRecordEl.textContent =
            `Rekordun: ${best} M`;

    }


    finalDistanceEl.textContent =
        final + " M";


    updateHUD();


    gameOverEl.style.display =
        "flex";


    createExplosion(
        player.x +
        player.width / 2,

        player.y +
        player.height / 2
    );


    beep(
        150,
        0.2
    );

}


/* =========================================
   HUD
========================================= */

function updateHUD(){

    distanceEl.textContent =
        Math.floor(
            distance
        );


    speedEl.textContent =
        (
            worldSpeed /
            6
        ).toFixed(1);


    bestEl.textContent =
        best;


    bestInfoEl.textContent =
        best;


    obstaclesPassedEl.textContent =
        obstacleCount;

}


/* =========================================
   DRAW
========================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();

    drawGround();

    drawObstacles();

    drawPlayer();

    drawParticles();

}


/* =========================================
   BACKGROUND
========================================= */

function drawBackground(){

    /* moon */

    ctx.beginPath();

    ctx.arc(
        760,
        95,
        48,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#e7f1ff";

    ctx.globalAlpha =
        0.9;

    ctx.fill();

    ctx.globalAlpha =
        1;


    /* stars */

    const stars = [
        [80,80,2],
        [180,130,1],
        [300,65,2],
        [420,110,1],
        [530,55,2],
        [650,155,1],
        [850,65,2],
        [720,210,1]
    ];


    for(
        const star of stars
    ){

        ctx.beginPath();

        ctx.arc(
            star[0],
            star[1],
            star[2],
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.globalAlpha =
            0.75;

        ctx.fill();

    }

    ctx.globalAlpha =
        1;


    /* distant city */

    ctx.fillStyle =
        "#101a32";

    for(
        let x=0;
        x<W;
        x+=55
    ){

        const h =
            40 +
            ((x * 17) % 80);

        ctx.fillRect(
            x,
            groundY - h,
            40,
            h
        );

    }

}


/* =========================================
   GROUND
========================================= */

function drawGround(){

    ctx.fillStyle =
        "#0b101c";

    ctx.fillRect(
        0,
        groundY,
        W,
        H-groundY
    );


    ctx.fillStyle =
        "#24304a";

    ctx.fillRect(
        0,
        groundY,
        W,
        5
    );


    ctx.fillStyle =
        "#39ff70";

    ctx.globalAlpha =
        0.35;

    ctx.fillRect(
        0,
        groundY,
        W,
        2
    );

    ctx.globalAlpha =
        1;


    /* ground lines */

    ctx.strokeStyle =
        "#192239";

    ctx.lineWidth =
        2;

    for(
        let x=0;
        x<W;
        x+=45
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            groundY + 30
        );

        ctx.lineTo(
            x + 20,
            groundY + 30
        );

        ctx.stroke();

    }

}


/* =========================================
   PLAYER
========================================= */

function drawPlayer(){

    const x =
        player.x;

    const y =
        player.y;


    /* shadow */

    ctx.beginPath();

    ctx.ellipse(
        x + player.width/2,
        groundY + 3,
        28,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#000000";

    ctx.globalAlpha =
        0.35;

    ctx.fill();

    ctx.globalAlpha =
        1;


    /* body */

    ctx.fillStyle =
        "#2ddcff";

    ctx.fillRect(
        x + 8,
        y + 25,
        26,
        34
    );


    /* head */

    ctx.beginPath();

    ctx.arc(
        x + 21,
        y + 15,
        15,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffd2b3";

    ctx.fill();


    /* hair */

    ctx.fillStyle =
        "#151515";

    ctx.beginPath();

    ctx.arc(
        x + 21,
        y + 11,
        15,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /* legs */

    ctx.fillStyle =
        "#e8edf7";

    ctx.fillRect(
        x + 10,
        y + 55,
        8,
        10
    );

    ctx.fillRect(
        x + 24,
        y + 55,
        8,
        10
    );


    /* eye */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        x + 26,
        y + 12,
        3,
        3
    );

}


/* =========================================
   OBSTACLES
========================================= */

function drawObstacles(){

    for(
        const obstacle of obstacles
    ){

        if(
            obstacle.type ===
            "spike"
        ){

            drawSpike(
                obstacle
            );

        }else{

            drawRock(
                obstacle
            );

        }

    }

}


function drawSpike(o){

    ctx.fillStyle =
        "#ff4c9a";

    ctx.beginPath();

    ctx.moveTo(
