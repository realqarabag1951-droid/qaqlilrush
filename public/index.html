<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

<title>QAQLIL RUSH</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 15% 10%, #2948b8 0%, transparent 30%),
        radial-gradient(circle at 85% 80%, #a31c72 0%, transparent 32%),
        linear-gradient(135deg, #060912, #0b1020 55%, #080914);

    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

button {
    font: inherit;
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.hidden {
    display: none !important;
}


/* =========================
   START SCREEN
========================= */

#startScreen {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.startBox {
    width: min(450px, 100%);

    padding: 35px 25px;

    text-align: center;

    background: rgba(10, 15, 28, 0.95);

    border: 1px solid #34415f;

    border-radius: 28px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);
}

.logo {
    font-size: clamp(38px, 11vw, 60px);
    font-weight: 1000;
    letter-spacing: 3px;
}

.logo span {
    color: #39ff70;
}

.description {
    margin-top: 10px;
    color: #aab4c8;
    font-size: 15px;
    line-height: 1.5;
}

.startButton {
    width: 100%;

    margin-top: 28px;

    padding: 17px;

    border-radius: 15px;

    background:
        linear-gradient(
            90deg,
            #39ff70,
            #2ddcff
        );

    color: #06100d;

    font-size: 18px;
    font-weight: 1000;

    box-shadow:
        0 10px 35px rgba(45,220,255,.2);
}

.startButton:active {
    transform: scale(.98);
}

.instructions {
    margin-top: 18px;

    color: #77839a;

    font-size: 13px;
}


/* =========================
   GAME PAGE
========================= */

#gamePage {
    width: min(1100px, 100%);

    margin: auto;

    padding: 14px;
}

header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 12px;
}

.headerLogo {
    font-size: clamp(27px, 6vw, 43px);
    font-weight: 1000;
    letter-spacing: 1px;
}

.headerLogo span {
    color: #39ff70;
}

.scoreBox {
    padding: 10px 15px;

    background: rgba(10,15,28,.9);

    border: 1px solid #303c58;

    border-radius: 14px;

    font-weight: 900;

    white-space: nowrap;
}

.scoreBox b {
    color: #39ff70;
}


/* =========================
   GAME CARD
========================= */

.gameCard {
    position: relative;

    overflow: hidden;

    background: #111;

    border: 1px solid #35415e;

    border-radius: 20px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.55);
}

.hud {
    height: 52px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 16px;

    background: #080d17;

    font-size: 14px;

    font-weight: 900;

    position: relative;

    z-index: 3;
}

.hud b {
    color: #39ff70;
}

canvas {
    display: block;

    width: 100%;
    height: auto;

    background: #17213b;

    touch-action: none;

    user-select: none;
}


/* =========================
   GAME OVER
========================= */

#gameOver {
    position: absolute;

    inset: 52px 0 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.68);

    z-index: 10;
}

.gameOverBox {
    width: min(390px, 90%);

    padding: 28px;

    text-align: center;

    background: #0c111d;

    border: 1px solid #485675;

    border-radius: 22px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.8);
}

.gameOverBox h1 {
    color: #ff4c9a;

    margin-bottom: 12px;

    font-size: 30px;
}

.distanceTitle {
    color: #9da8bb;
}

.finalDistance {
    margin: 8px 0 20px;

    color: #2ddcff;

    font-size: 48px;

    font-weight: 1000;
}

.restartButton {
    width: 100%;

    padding: 15px;

    border-radius: 13px;

    background:
        linear-gradient(
            90deg,
            #39ff70,
            #2ddcff
        );

    color: #06100d;

    font-weight: 1000;

    font-size: 16px;
}


/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;

    gap: 10px;

    margin-top: 10px;
}

.controlButton {
    flex: 1;

    padding: 15px;

    border-radius: 14px;

    font-weight: 1000;
}

.jumpButton {
    background:
        linear-gradient(
            90deg,
            #39ff70,
            #2ddcff
        );

    color: #06100d;
}

.restartControl {
    background: #151e30;

    color: white;

    border: 1px solid #35415e;
}

.controlButton:active {
    transform: scale(.98);
}


/* =========================
   FOOTER
========================= */

footer {
    padding: 25px 5px 15px;

    text-align: center;

    color: #7f8ba0;

    font-size: 14px;
}

footer a {
    color: #2ddcff;

    font-weight: 900;

    text-decoration: none;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #gamePage {
        padding: 8px;
    }

    header {
        margin-bottom: 8px;
    }

    .headerLogo {
        font-size: 26px;
    }

    .scoreBox {
        padding: 8px 10px;
        font-size: 12px;
    }

    .hud {
        height: 46px;
        font-size: 11px;
    }

    #gameOver {
        inset: 46px 0 0;
    }

    .controls {
        flex-direction: column;
    }

    .controlButton {
        padding: 14px;
    }
}
</style>
</head>

<script>
"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const gamePage =
    document.getElementById("gamePage");

const startButton =
    document.getElementById("startButton");

const jumpButton =
    document.getElementById("jumpButton");

const restartButton =
    document.getElementById("restartButton");

const restartGameOver =
    document.getElementById("restartGameOver");

const gameOver =
    document.getElementById("gameOver");

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const distanceText =
    document.getElementById("distance");

const scoreText =
    document.getElementById("score");

const bestScoreText =
    document.getElementById("bestScore");

const finalDistanceText =
    document.getElementById("finalDistance");


/* =====================================================
   GAME SETTINGS
===================================================== */

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const GROUND_Y = 410;

const GRAVITY = 0.72;

const JUMP_POWER = -13.5;


/* =====================================================
   GAME STATE
===================================================== */

let running = false;

let gameOverState = false;

let animationId = null;

let lastTime = 0;

let distance = 0;

let score = 0;

let speed = 6;

let obstacleTimer = 0;

let nextObstacle = 90;


/* =====================================================
   BEST SCORE
===================================================== */

let best =
    Number(
        localStorage.getItem(
            "qaqlil_best"
        ) || 0
    );

bestScoreText.textContent =
    best;


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x: 120,

    y: GROUND_Y - 72,

    width: 48,

    height: 72,

    velocityY: 0,

    grounded: true

};


/* =====================================================
   OBSTACLES
===================================================== */

let obstacles = [];


/* =====================================================
   CLOUDS
===================================================== */

const clouds = [

    {
        x: 100,
        y: 75,
        size: 1
    },

    {
        x: 430,
        y: 110,
        size: .75
    },

    {
        x: 730,
        y: 65,
        size: 1.15
    }
];


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    startScreen.classList.add("hidden");

    gamePage.classList.remove("hidden");

    resetGame();

}


/* =====================================================
   RESET
===================================================== */

function resetGame() {

    cancelAnimationFrame(animationId);

    running = true;

    gameOverState = false;

    distance = 0;

    score = 0;

    speed = 6;

    obstacleTimer = 0;

    nextObstacle = 80;

    obstacles = [];

    player.x = 120;

    player.y =
        GROUND_Y -
        player.height;

    player.velocityY = 0;

    player.grounded = true;

    distanceText.textContent = "0";

    scoreText.textContent = "0";

    gameOver.style.display = "none";

    lastTime = performance.now();

    animationId =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================================
   JUMP
===================================================== */

function jump() {

    if (!running || gameOverState) {
        return;
    }

    if (player.grounded) {

        player.velocityY =
            JUMP_POWER;

        player.grounded =
            false;
    }

}


/* =====================================================
   CREATE OBSTACLE
===================================================== */

function createObstacle() {

    const height =
        40 +
        Math.random() * 65;

    const width =
        30 +
        Math.random() * 25;

    obstacles.push({

        x: WIDTH + 20,

        y:
            GROUND_Y -
            height,

        width: width,

        height: height

    });

}


/* =====================================================
   COLLISION
===================================================== */

function collision(a, b) {

    const padding = 8;

    return (

        a.x + padding <
        b.x + b.width &&

        a.x +
        a.width -
        padding >
        b.x &&

        a.y + padding <
        b.y + b.height &&

        a.y +
        a.height -
        padding >
        b.y

    );

}


/* =====================================================
   UPDATE
===================================================== */

function update(delta) {

    if (!running || gameOverState) {
        return;
    }


    /* PLAYER */

    player.velocityY +=
        GRAVITY * delta;

    player.y +=
        player.velocityY * delta;


    if (
        player.y +
        player.height >=
        GROUND_Y
    ) {

        player.y =
            GROUND_Y -
            player.height;

        player.velocityY = 0;

        player.grounded = true;

    }


    /* DISTANCE */

    distance +=
        speed *
        delta *
        0.08;

    distance =
        Math.floor(distance);


    score =
        distance;


    distanceText.textContent =
        distance;

    scoreText.textContent =
        score;


    /* SPEED */

    speed =
        Math.min(
            13,
            6 +
            distance / 450
        );


    /* OBSTACLES */

    obstacleTimer +=
        delta;

    if (
        obstacleTimer >=
        nextObstacle
    ) {

        createObstacle();

        obstacleTimer = 0;

        nextObstacle =
            65 +
            Math.random() * 85;

    }


    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const obstacle =
            obstacles[i];

        obstacle.x -=
            speed *
            delta;


        if (
            collision(
                player,
                obstacle
            )
        ) {

            endGame();

            return;

        }


        if (
            obstacle.x +
            obstacle.width <
            -50
        ) {

            obstacles.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   DRAW SKY
===================================================== */

function drawSky() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            HEIGHT
        );

    gradient.addColorStop(
        0,
        "#182c68"
    );

    gradient.addColorStop(
        1,
        "#6f356b"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /* SUN */

    ctx.beginPath();

    ctx.arc(
        760,
        100,
        55,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffd86b";

    ctx.fill();


    /* CLOUDS */

    clouds.forEach(cloud => {

        drawCloud(
            cloud.x,
            cloud.y,
            cloud.size
        );

    });

}


/* =====================================================
   CLOUD
===================================================== */

function drawCloud(
    x,
    y,
    scale
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        scale,
        scale
    );

    ctx.fillStyle =
        "rgba(255,255,255,.82)";

    ctx.beginPath();

    ctx.arc(
        0,
        10,
        20,
        0,
        Math.PI * 2
    );

    ctx.arc(
        25,
        0,
        27,
        0,
        Math.PI * 2
    );

    ctx.arc(
        55,
        12,
        20,
        0,
        Math.PI * 2
    );

    ctx.fillRect(
        0,
        10,
        55,
        22
    );

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   DRAW MOUNTAINS
===================================================== */

function drawMountains() {

    ctx.fillStyle =
        "#17254a";

    ctx.beginPath();

    ctx.moveTo(
        0,
        GROUND_Y
    );

    for (
        let x = 0;
        x <= WIDTH;
        x += 100
    ) {

        const h =
            80 +
            Math.sin(x * .018) * 35;

        ctx.lineTo(
            x,
            GROUND_Y - h
        );

    }

    ctx.lineTo(
        WIDTH,
        GROUND_Y
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#101a36";

    ctx.beginPath();

    ctx.moveTo(
        0,
        GROUND_Y
    );

    for (
        let x = 0;
        x <= WIDTH;
        x += 75
    ) {

        const h =
            45 +
            Math.cos(x * .025) * 25;

        ctx.lineTo(
            x,
            GROUND_Y - h
        );

    }

    ctx.lineTo(
        WIDTH,
        GROUND_Y
    );

    ctx.closePath();

    ctx.fill();

}


/* =====================================================
   DRAW GROUND
===================================================== */

function drawGround() {

    ctx.fillStyle =
        "#202b25";

    ctx.fillRect(
        0,
        GROUND_Y,
        WIDTH,
        HEIGHT -
        GROUND_Y
    );


    ctx.fillStyle =
        "#39ff70";

    ctx.fillRect(
        0,
        GROUND_Y,
        WIDTH,
        6
    );


    ctx.fillStyle =
        "#303b31";

    const offset =
        -(distance * 4) % 50;

    for (
        let x = offset;
        x < WIDTH;
        x += 50
    ) {

        ctx.fillRect(
            x,
            GROUND_Y + 35,
            25,
            5
        );

    }

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer() {

    const x =
        player.x;

    const y =
        player.y;


    /* SHADOW */

    ctx.beginPath();

    ctx.ellipse(
        x + player.width / 2,
        GROUND_Y + 4,
        28,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.fill();


    /* BODY */

    ctx.fillStyle =
        "#39ff70";

    ctx.fillRect(
        x + 8,
        y + 25,
        32,
        42
    );


    /* HEAD */

    ctx.beginPath();

    ctx.arc(
        x + 24,
        y + 15,
        17,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffd0a6";

    ctx.fill();


    /* HAIR */

    ctx.fillStyle =
        "#171717";

    ctx.beginPath();

    ctx.arc(
        x + 24,
        y + 10,
        17,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /* EYES */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        x + 17,
        y + 13,
        4,
        5
    );

    ctx.fillRect(
        x + 28,
        y + 13,
        4,
        5
    );


    /* LEGS */

    ctx.fillStyle =
        "#25324f";

    ctx.fillRect(
        x + 10,
        y + 65,
        11,
        7
    );

    ctx.fillRect(
        x + 28,
        y + 65,
        11,
        7
    );


    /* ARMS */

    ctx.strokeStyle =
        "#ffd0a6";

    ctx.lineWidth = 7;

    ctx.lineCap =
        "round";

    ctx.beginPath();

    ctx.moveTo(
        x + 8,
        y + 32
    );

    ctx.lineTo(
        x - 2,
        y + 48
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        x + 40,
        y + 32
    );

    ctx.lineTo(
        x + 50,
        y + 48
    );

    ctx.stroke();

}


/* ================
