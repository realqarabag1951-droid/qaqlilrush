<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>QAQLIL RUSH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;
    background:#07111f;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    user-select:none;
    -webkit-user-select:none;
}

#app{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:12px;
}

.gameWrap{
    width:min(1100px,100%);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.logo{
    font-size:clamp(25px,5vw,42px);
    font-weight:1000;
    letter-spacing:1px;
    text-shadow:0 4px 15px #0008;
}

.logo span{
    color:#39ff72;
}

.stats{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.stat{
    padding:9px 13px;
    border-radius:14px;
    background:#101c2d;
    border:1px solid #30425e;
    font-size:14px;
    font-weight:900;
    box-shadow:0 5px 20px #0005;
}

.stat b{
    color:#ffd43b;
}

.gameBox{
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:22px;
    border:2px solid #344b68;
    background:#101b29;
    box-shadow:
        0 25px 80px #000b,
        0 0 35px #2ddcff18;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:16 / 9;
    touch-action:none;
}

.hint{
    text-align:center;
    margin-top:9px;
    color:#9eacc0;
    font-size:13px;
}

.bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.restart{
    border:0;
    padding:13px 22px;
    border-radius:13px;
    background:linear-gradient(90deg,#ffb52e,#ff6b35);
    color:#17100a;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 7px 20px #0006;
}

.restart:active{
    transform:scale(.96);
}

.social{
    color:#9daabd;
    font-size:13px;
}

.social a{
    color:#2ddcff;
    text-decoration:none;
    font-weight:900;
}

.overlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#020712aa;
    backdrop-filter:blur(3px);
}

.overlay.show{
    display:flex;
}

.gameOver{
    width:min(360px,88%);
    padding:28px;
    border-radius:22px;
    text-align:center;
    background:#0d1726;
    border:1px solid #52647e;
    box-shadow:0 20px 60px #000c;
}

.gameOver h1{
    font-size:34px;
    margin-bottom:8px;
    color:#ff5d91;
}

.gameOver p{
    color:#aeb9ca;
}

.finalScore{
    font-size:52px;
    font-weight:1000;
    color:#39ff72;
    margin:8px 0 18px;
}

.restartBig{
    width:100%;
    padding:14px;
    border:0;
    border-radius:13px;
    background:linear-gradient(90deg,#39ff72,#2ddcff);
    color:#07120d;
    font-weight:1000;
    cursor:pointer;
}

@media(max-width:650px){

    #app{
        padding:7px;
    }

    .topbar{
        align-items:flex-start;
    }

    .stats{
        gap:5px;
    }

    .stat{
        padding:7px 9px;
        font-size:11px;
    }

    .bottom{
        flex-direction:column;
    }

    .restart{
        width:100%;
    }

    .social{
        text-align:center;
    }

}
</style>
</head>

<body>

<div id="app">

<div class="gameWrap">

    <div class="topbar">

        <div class="logo">
            QAQLIL <span>RUSH</span>
        </div>

        <div class="stats">

            <div class="stat">
                🏆 <b id="score">0</b> M
            </div>

            <div class="stat">
                ⭐ <b id="coins">0</b>
            </div>

            <div class="stat">
                🔥 <b id="best">0</b>
            </div>

        </div>

    </div>


    <div class="gameBox">

        <canvas
            id="game"
            width="960"
            height="540"
        ></canvas>


        <div
            id="gameOver"
            class="overlay"
        >

            <div class="gameOver">

                <h1>OYUN BİTDİ!</h1>

                <p>Məsafən</p>

                <div
                    id="finalScore"
                    class="finalScore"
                >
                    0 M
                </div>

                <button
                    id="restartBig"
                    class="restartBig"
                >
                    ↻ YENİDƏN OYNA
                </button>

            </div>

        </div>

    </div>


    <div class="hint">
        🖐 Ekrana toxun və ya SPACE bas — tullanan oyunçu
    </div>


    <div class="bottom">

        <button
            id="restart"
            class="restart"
        >
            ↻ RESTART
        </button>

        <div class="social">
            TikTok:
            <a
                href="https://www.tiktok.com/@ssamirreds"
                target="_blank"
                rel="noopener noreferrer"
            >
                @ssamirreds
            </a>
        </div>

    </div>

</div>

</div>


<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   UI
===================================================== */

const scoreEl =
    document.getElementById("score");

const coinsEl =
    document.getElementById("coins");

const bestEl =
    document.getElementById("best");

const gameOverEl =
    document.getElementById("gameOver");

const finalScoreEl =
    document.getElementById("finalScore");

const restartButton =
    document.getElementById("restart");

const restartBig =
    document.getElementById("restartBig");


/* =====================================================
   GAME STATE
===================================================== */

let running = true;

let score = 0;

let coins = 0;

let best =
    Number(
        localStorage.getItem("qaqlil_best") || 0
    );

let speed = 6;

let frame = 0;

let groundY = 450;

let obstacleTimer = 0;

let coinTimer = 80;

let clouds = [];

let obstacles = [];

let coinObjects = [];

let particles = [];


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x:150,

    y:370,

    width:58,

    height:78,

    velocityY:0,

    gravity:0.75,

    jumpPower:-14,

    onGround:true,

    rotation:0,

    squash:1

};


/* =====================================================
   BACKGROUND CLOUDS
===================================================== */

for(let i=0;i<12;i++){

    clouds.push({

        x:Math.random()*960,

        y:50+Math.random()*190,

        size:30+Math.random()*45,

        speed:.25+Math.random()*.45

    });

}


/* =====================================================
   HELPERS
===================================================== */

function random(min,max){

    return Math.random()*(max-min)+min;

}


function rectCollision(a,b){

    return (

        a.x < b.x+b.width &&

        a.x+a.width > b.x &&

        a.y < b.y+b.height &&

        a.y+a.height > b.y

    );

}


function addParticle(x,y){

    particles.push({

        x:x,

        y:y,

        vx:random(-2,2),

        vy:random(-3,-1),

        life:30,

        size:random(2,5)

    });

}


/* =====================================================
   JUMP
===================================================== */

function jump(){

    if(!running){

        restartGame();

        return;

    }

    if(player.onGround){

        player.velocityY =
            player.jumpPower;

        player.onGround =
            false;

        player.squash =
            .85;

        for(let i=0;i<8;i++){

            addParticle(
                player.x+20,
                groundY
            );

        }

    }

}


/* =====================================================
   INPUT
===================================================== */

canvas.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();

    },
    {passive:false}
);


document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();

        }

    }
);


/* =====================================================
   RESTART
===================================================== */

function restartGame(){

    running = true;

    score = 0;

    coins = 0;

    speed = 6;

    frame = 0;

    obstacleTimer = 60;

    coinTimer = 50;

    obstacles = [];

    coinObjects = [];

    particles = [];

    player.x = 150;

    player.y = groundY-player.height;

    player.velocityY = 0;

    player.onGround = true;

    player.rotation = 0;

    player.squash = 1;

    gameOverEl.classList.remove("show");

    updateUI();

}


restartButton.addEventListener(
    "click",
    restartGame
);


restartBig.addEventListener(
    "click",
    restartGame
);


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    if(!running) return;

    running = false;

    const final =
        Math.floor(score);

    if(final > best){

        best = final;

        localStorage.setItem(
            "qaqlil_best",
            String(best)
        );

    }

    finalScoreEl.textContent =
        final + " M";

    gameOverEl.classList.add("show");

    updateUI();

}


/* =====================================================
   CREATE OBSTACLE
===================================================== */

function createObstacle(){

    const type =
        Math.floor(
            Math.random()*5
        );


    let obstacle;


    if(type === 0){

        obstacle = {

            type:"spikes",

            x:1000,

            y:400,

            width:65,

            height:50

        };

    }


    else if(type === 1){

        obstacle = {

            type:"crate",

            x:1000,

            y:380,

            width:70,

            height:70

        };

    }


    else if(type === 2){

        obstacle = {

            type:"barrel",

            x:1000,

            y:395,

            width:55,

            height:55

        };

    }


    else if(type === 3){

        obstacle = {

            type:"wall",

            x:1000,

            y:350,

            width:50,

            height:100

        };

    }


    else{

        obstacle = {

            type:"double",

            x:1000,

            y:395,

            width:105,

            height:55

        };

    }


    obstacles.push(obstacle);

}


/* =====================================================
   CREATE COIN
===================================================== */

function createCoin(){

    coinObjects.push({

        x:1000,

        y:random(280,370),

        r:13,

        spin:0

    });

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    frame++;


    if(!running){

        updateParticles();

        return;

    }


    /* SPEED */

    speed =
        Math.min(
            11,
            6 + score/800
        );


    /* SCORE */

    score += speed*0.045;


    /* PLAYER PHYSICS */

    player.velocityY +=
        player.gravity;

    player.y +=
        player.velocityY;


    if(
        player.y +
        player.height >=
        groundY
    ){

        player.y =
            groundY -
            player.height;

        player.velocityY = 0;

        player.onGround = true;

        player.rotation = 0;

    }else{

        player.rotation =
            Math.max(
                -0.25,
                Math.min(
                    0.25,
                    player.velocityY*0.025
                )
            );

    }


    player.squash +=
        (1-player.squash)*0.15;


    /* OBSTACLES */

    obstacleTimer--;

    if(obstacleTimer <= 0){

        createObstacle();

        obstacleTimer =
            Math.max(
                55,
                105 -
                speed*4 +
                random(-15,25)
            );

    }


    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o =
            obstacles[i];

        o.x -= speed;


        if(
            rectCollision(
                {
                    x:player.x+8,
                    y:player.y+7,
                    width:player.width-16,
                    height:player.height-10
                },
                {
                    x:o.x+5,
                    y:o.y+5,
                    width:o.width-10,
                    height:o.height-5
                }
            )
        ){

            gameOver();

        }


        if(o.x+o.width < 0){

            obstacles.splice(i,1);

        }

    }


    /* COINS */

    coinTimer--;

    if(coinTimer <= 0){

        createCoin();

        coinTimer =
            random(45,95);

    }


    for(
        let i=coinObjects.length-1;
        i>=0;
        i--
    ){

        const c =
            coinObjects[i];

        c.x -= speed;

        c.spin += .15;


        const dx =
            player.x +
            player.width/2 -
            c.x;

        const dy =
            player.y +
            player.height/2 -
            c.y;


        if(
            Math.sqrt(dx*dx+dy*dy)
            <
            c.r+25
        ){

            coins++;

            for(let j=0;j<8;j++){

                addParticle(
                    c.x,
                    c.y
                );

            }

            coinObjects.splice(i,1);

            continue;

        }


        if(c.x < -30){

            coinObjects.splice(i,1);

        }

    }


    /* CLOUDS */

    for(const cloud of clouds){

        cloud.x -= cloud.speed;

        if(cloud.x < -100){

            cloud.x = 1000;

            cloud.y =
                50+Math.random()*180;

        }

    }


    updateParticles();

    updateUI();

}


/* =====================================================
   PARTICLES
===================================================== */

function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.x += p.vx;

        p.y += p.vy;

        p.vy += .12;

        p.life--;

        if(p.life <= 0){

            particles.splice(i,1);

        }

    }

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    scoreEl.textContent =
        Math.floor(score);

    coinsEl.textContent =
        coins;

    bestEl.textContent =
        best;

}


/* =====================================================
   DRAW SKY
===================================================== */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            540
        );

    gradient.addColorStop(
        0,
        "#248de0"
    );

    gradient.addColorStop(
        .55,
        "#79d7ff"
    );

    gradient.addColorStop(
        1,
        "#d6f5ff"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        960,
        540
    );


    /* SUN */

    ctx.beginPath();

    ctx.arc(
        790,
        95,
        48,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#ffe26a";

    ctx.fill();


    /* CLOUDS */

    for(const cloud of clouds){

        drawCloud(
            cloud.x,
            cloud.y,
            cloud.size
        );

    }


    /* FAR MOUNTAINS */

    ctx.fillStyle =
        "#729ab2";

    ctx.beginPath();

    ctx.moveTo(0,360);

    ctx.lineTo(130,220);

    ctx.lineTo(230,350);

    ctx.lineTo(350,190);

    ctx.lineTo(500,350);

    ctx.lineTo(650,230);

    ctx.lineTo(820,350);

    ctx.lineTo(960,200);

    ctx.lineTo(960,450);

    ctx.lineTo(0,450);

    ctx.closePath();

    ctx.fill();


    /* NEAR MOUNTAINS */

    ctx.fillStyle =
        "#4e8192";

    ctx.beginPath();

    ctx.moveTo(0,400);

    ctx.lineTo(190,275);

    ctx.lineTo(330,400);

    ctx.lineTo(500,260);

    ctx.lineTo(700,400);

    ctx.lineTo(830,290);

    ctx.lineTo(960,400);

    ctx.lineTo(960,450);

    ctx.lineTo(0,450);

    ctx.closePath();

    ctx.fill();


    /* TREES */

    drawTree(70,390,1);

    drawTree(850,385,1.15);

    drawTree(735,405,.75);


    /* GROUND */

    ctx.fillStyle =
        "#5b371f";

    ctx.fillRect(
        0,
        groundY,
        960,
        90
    );


    ctx.fillStyle =
        "#3f2818";

    for(let x=0;x<960;x+=55){

        ctx.beginPath();

        ctx.arc(
            x+20,
            groundY+30+
            Math.sin(x)*10,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* GRASS */

    ctx.fillStyle =
        "#43b83f";

    ctx.fillRect(
        0,
        groundY-8,
        960,
        13
    );

    ctx.fillStyle =
        "#7ce34c";

    ctx.fillRect(
        0,
        groundY-8,
        960,
        4
    );

}


/* =====================================================
   CLOUD
===================================================== */

function drawCloud(x,y,size){

    ctx.fillStyle =
        "#ffffffcc";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size*.45,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+size*.45,
        y-10,
        size*.6,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+size,
        y,
        size*.45,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   TREE
===================================================== */

function drawTree(x,y,s){

    ctx.save();

    ctx.translate(x,y);

    ctx.scale(s,s);

    ctx.fillStyle =
        "#70411e";

    ctx.fillRect(
        -12,
        -95,
        24,
        95
    );


    ctx.fillStyle =
        "#247a39";

    ctx.beginPath();

    ctx.arc(
        0,
        -115,
        52,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#39a84c";

    ctx.beginPath();

    ctx.arc(
        -35,
        -100,
        32,
        0,
        Math.PI*2
    );

    ctx.arc(
        35,
        -100,
        32,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(){

    ctx.save();

    const cx =
        player.x +
        player.width/2;

    const cy =
        player.y +
        player.height/2;


    ctx.translate(
        cx,
        cy
    );

    ctx.rotate(
        player.rotation
    );

    ctx.scale(
        player.squash,
        2-player.squash
    );


    /* SHADOW */

    ctx.restore();

    ctx.fillStyle =
        "#0005";

    ctx.beginPath();

    ctx.ellipse(
        player.x+29,
        groundY+2,
        28,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.save();

    ctx.translate(
        cx,
        cy
    );

    ctx.rotate(
        player.rotation
    );


    /* LEGS */

    ctx.strokeStyle =
        "#18212d";

    ctx.lineWidth = 11;

    ctx.lineCap =
        "round";

    ctx.beginPath();

    ctx.moveTo(-8,20);

    ctx.lineTo(-17,39);

    ctx.moveTo(8,20);

    ctx.lineTo(18,39);

    ctx.stroke();


    /* SHOES */

    ctx.strokeStyle =
        "#f4f4f4";

    ctx
