<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>QAQLIL RUSH</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;

    background:
        radial-gradient(
            circle at 15% 10%,
            #253c9c 0,
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 80%,
            #92145f 0,
            transparent 35%
        ),
        #070a13;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.hidden {
    display: none !important;
}


/* =========================
   NAME PAGE
========================= */

#namePage {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.nameBox {
    width: 100%;
    max-width: 430px;

    padding: 30px;

    text-align: center;

    background: #0c111d;

    border: 1px solid #35415e;

    border-radius: 25px;

    box-shadow:
        0 25px 80px #000b;
}

.logo {
    font-size: 42px;
    font-weight: 1000;
    letter-spacing: 2px;
}

.logo span,
.headerLogo span {
    color: #39ff70;
}

.subtitle {
    color: #9da8bb;
    margin: 10px 0 25px;
}

.nameInput {
    width: 100%;

    padding: 15px;

    color: #fff;

    background: #111827;

    border: 1px solid #303c58;

    border-radius: 13px;

    outline: none;

    text-align: center;
}

.nameInput:focus {
    border-color: #2ddcff;

    box-shadow:
        0 0 0 2px #2ddcff22;
}

.primary {
    background:
        linear-gradient(
            90deg,
            #39ff70,
            #2ddcff
        );

    color: #06100d;

    border: 0;
}

.btn {
    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border-radius: 13px;

    font-weight: 900;
}

#errorMessage {
    min-height: 22px;

    margin-top: 10px;

    color: #ff5e94;

    font-weight: 700;
}


/* =========================
   GAME PAGE
========================= */

#gamePage {
    width: min(1100px, 100%);

    margin: auto;

    padding: 12px;
}

header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 10px;

    margin-bottom: 12px;
}

.headerLogo {
    font-size: clamp(27px, 6vw, 42px);

    font-weight: 1000;
}

.userInfo {
    padding: 10px 13px;

    border-radius: 15px;

    background: #0c1320;

    border: 1px solid #303b56;

    font-weight: 800;

    font-size: 14px;
}

.card {
    background: #0c111d;

    border: 1px solid #2d3954;

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 18px 50px #0008;
}


/* =========================
   GAME
========================= */

.gameCard {
    position: relative;
}

.hud {
    height: 52px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

    background: #090e18;

    font-weight: 900;

    font-size: 14px;
}

.hud b {
    color: #39ff70;
}

canvas {
    display: block;

    width: 100%;

    height: auto;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

    background: #101827;
}


/* =========================
   GAME OVER
========================= */

#gameOver {
    display: none;

    position: absolute;

    inset: 52px 0 0;

    align-items: center;
    justify-content: center;

    background: #000b;

    z-index: 10;
}

.gameOverBox {
    width: min(390px, 90%);

    padding: 28px;

    text-align: center;

    background: #0c111d;

    border: 1px solid #485675;

    border-radius: 20px;

    box-shadow:
        0 20px 70px #000c;
}

.gameOverBox h1 {
    color: #ff4c9a;

    margin-bottom: 5px;
}

.finalDistance {
    margin: 7px;

    font-size: 44px;

    font-weight: 1000;

    color: #2ddcff;
}

.earned {
    margin-bottom: 18px;

    color: #39ff70;

    font-size: 22px;

    font-weight: 1000;
}


/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;

    gap: 10px;

    margin-top: 10px;
}

.controls button {
    flex: 1;

    padding: 14px;

    border-radius: 13px;

    font-weight: 900;
}

.secondary {
    background: #171f2e;

    color: #fff;

    border: 1px solid #34405b;
}


/* =========================
   LEADERBOARD
========================= */

.leaderCard {
    margin-top: 12px;

    padding: 15px;
}

.leaderCard h2 {
    margin-bottom: 10px;
}

.leader {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 12px 7px;

    border-bottom: 1px solid #20293a;
}

.rank {
    width: 30px;

    color: #8f9aae;

    font-weight: 900;
}

.player {
    flex: 1;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.score {
    color: #39ff70;

    font-weight: 900;

    white-space: nowrap;
}

.me {
    background: #123c24;

    border-radius: 10px;
}


/* =========================
   ONLINE
========================= */

.onlineTitle {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;
}

.onlineCount {
    color: #39ff70;

    font-size: 14px;

    font-weight: 900;
}

.onlineUser {
    display: flex;

    align-items: center;

    gap: 9px;

    padding: 10px 7px;

    border-bottom: 1px solid #20293a;
}

.onlineDot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #39ff70;

    box-shadow:
        0 0 10px #39ff70;
}

.onlineName {
    font-weight: 800;
}


/* =========================
   FOOTER
========================= */

footer {
    padding: 25px 5px 12px;

    text-align: center;

    color: #8e99ac;

    font-size: 14px;
}

footer a {
    color: #2ddcff;

    font-weight: 900;

    text-decoration: none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .nameBox {
        padding: 23px;
    }

    .logo {
        font-size: 34px;
    }

    .headerLogo {
        font-size: 27px;
    }

    .userInfo {
        font-size: 12px;
    }

    .hud {
        font-size: 11px;
    }

    .controls {
        flex-direction: column;
    }
}
</style>
</head>

<body>

            </div>

<!-- CONTROLS -->

<div class="card leaderCard">

    <div class="onlineTitle">

</div>


<!-- LEADERBOARD -->

<div class="card leaderCard">

    <h2>

        <div class="leader">

</div>


<footer>

<script>

"use strict";


/* =====================================================
   GLOBAL
===================================================== */

const $ = id =>
    document.getElementById(id);

let playerName = "";

let gameRunning = false;

let gameOver = false;

let animationId = null;

let lastTime = 0;

let distance = 0;

let score = 0;

let bestDistance = 0;

let player = null;

let obstacles = [];

let particles = [];

let groundY = 420;

let speed = 360;

let obstacleTimer = 0;

let onlineTimer = null;

let leaderboardTimer = null;


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    $("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   LOCAL DATA
===================================================== */

function loadLocalData() {

    bestDistance =
        Number(
            localStorage.getItem(
                "qaqlil_best_" + playerName
            ) || 0
        );

    $("best").textContent =
        bestDistance;
}


function saveLocalData() {

    if (distance > bestDistance) {

        bestDistance =
            Math.floor(distance);

        localStorage.setItem(
            "qaqlil_best_" + playerName,
            bestDistance
        );
    }
}


/* =====================================================
   SERVER API
===================================================== */

async function serverRequest(
    path,
    options = {}
) {

    try {

        const response =
            await fetch(
                path,
                {
                    ...options,

                    headers: {
                        "Content-Type":
                            "application/json",

                        ...(options.headers || {})
                    }
                }
            );

        const type =
            response.headers.get(
                "content-type"
            ) || "";

        if (
            !type.includes(
                "application/json"
            )
        ) {

            return null;
        }

        return await response.json();

    } catch (error) {

        console.warn(
            "Server connection:",
            error
        );

        return null;
    }
}


/* =====================================================
   JOIN
===================================================== */

async function joinGame() {

    const data =
        await serverRequest(
            "/api/join",
            {
                method: "POST",

                body:
                    JSON.stringify({
                        name: playerName
                    })
            }
        );

    if (data) {

        if (
            Number.isFinite(
                Number(data.best)
            )
        ) {

            bestDistance =
                Number(data.best);

            localStorage.setItem(
                "qaqlil_best_" + playerName,
                bestDistance
            );
        }
    }

    loadOnlineUsers();

    loadLeaderboard();
}


/* =====================================================
   SEND SCORE
===================================================== */

async function sendScore() {

    const finalScore =
        Math.floor(distance);

    const data =
        await serverRequest(
            "/api/score",
            {
                method: "POST",

                body:
                    JSON.stringify({
                        name: playerName,
                        score: finalScore
                    })
            }
        );

    if (data) {

        if (
            Number.isFinite(
                Number(data.best)
            )
        ) {

            bestDistance =
                Math.max(
                    bestDistance,
                    Number(data.best)
                );

            localStorage.setItem(
                "qaqlil_best_" + playerName,
                bestDistance
            );

            $("best").textContent =
                bestDistance;
        }
    }

    loadLeaderboard();
}


/* =====================================================
   ONLINE USERS
===================================================== */

async function loadOnlineUsers() {

    const data =
        await serverRequest(
            "/api/online"
        );

    const box =
        $("onlineUsers");

    if (
        !data ||
        !Array.isArray(data.users)
    ) {

        box.innerHTML = `
            <div class="onlineUser">
                <span class="onlineDot"></span>
                <span class="onlineName">
                    ${escapeHTML(playerName)}
                </span>
            </div>
        `;

        $("onlineCount").textContent =
            "1 nəfər";

        return;
    }


    box.innerHTML = "";

    data.users.forEach(
        name => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "onlineUser";

            row.innerHTML = `
                <span class="onlineDot"></span>
                <span class="onlineName"></span>
            `;

            row.querySelector(
                ".onlineName"
            ).textContent = name;

            box.appendChild(row);
        }
    );


    $("onlineCount").textContent =
        data.users.length +
        " nəfər";
}


/* =====================================================
   LEADERBOARD
===================================================== */

async function loadLeaderboard() {

    const box =
        $("leaderboard");

    const data =
        await serverRequest(
            "/api/leaderboard"
        );

    if (
        !data ||
        !Array.isArray(data.players)
    ) {

        box.innerHTML = `
            <div class="leader">
                <span class="rank">1</span>
                <span class="player"></span>
                <span class="score"></span>
            </div>
        `;

        box.querySelector(
            ".player"
        ).textContent =
            playerName;

        box.querySelector(
            ".score"
        ).textContent =
            bestDistance + " M";

        return;
    }


    box.innerHTML = "";


    if (!data.players.length) {

        box.innerHTML =
            `<div class="leader">
                Hələ heç kim yoxdur.
            </div>`;

        return;
    }


    data.players.forEach(
        (item, index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "leader";


            if (
                item.name === playerName
            ) {

                row.classList.add(
                    "me"
                );
            }


            const rank =
                document.createElement(
                    "span"
                );

            rank.className =
                "rank";

            rank.textContent =
                index + 1;


            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "player";

            name.textContent =
                item.name;


            const value =
                document.createElement(
                    "span"
                );

            value.className =
                "score";

            value.textContent =
                Number(
                    item.score || 0
                ) + " M";


            row.appendChild(rank);

            row.appendChild(name);

            row.appendChild(value);

            box.appendChild(row);
        }
    );
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}


/* =====================================================
   NAME VALIDATION
===================================================== */

function validName(name) {

    return /^[A-Za-z0-9_]{3,18}$/
        .test(name);
}


/* =====================================================
   START
===================================================== */

async function startGame() {

    const input =
        $("nameInput");

    const name =
        input.value.trim();

    $("errorMessage")
        .textContent = "";


    if (!validName(name)) {

        $("errorMessage")
            .textContent =
            "Ad 3-18 simvol olmalıdır. Yalnız hərf, rəqəm və _ istifadə et.";

        return;
    }


    playerName =
        name;


    $("namePage")
        .classList
        .add("hidden");


    $("gamePage")
        .classList
        .remove("hidden");


    $("username")
        .textContent =
        playerName;


    loadLocalData();

    await joinGame();

    restartGame();


    if (onlineTimer)
        clearInterval(onlineTimer);

    onlineTimer =
        setInterval(
            loadOnlineUsers,
            5000
        );


    if (leaderboardTimer)
        clearInterval(leaderboardTimer);

    leaderboardTimer =
        setInterval(
            loadLeaderboard,
            5000
        );
}


/* =====================================================
   PLAYER
===================================================== */

function createPlayer() {

    player = {

        x: 120,

        y: groundY - 55,

        width: 42,

        height: 55,

        velocityY: 0,

        jumpPower: -720,

        gravity: 1900,

        onGround: true
    };
}


/* =====================================================
   OBSTACLE
===================================================== */

function createObstacle() {

    const height =
        35 +
        Math.random() * 65;

    const width =
        25 +
