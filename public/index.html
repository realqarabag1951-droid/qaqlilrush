    background:#0c111d;

    border-radius:20px;
    overflow:hidden;
    box-shadow:0 18px 50px #0008;
}

/* GAME */

.gameCard{
    position:relative;
}

.hud{
    height:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#090e18;
    font-weight:900;
    font-size:14px;
}

.hud b{
    color:#39ff70;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:#111827;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

/* GAME OVER */

#gameOver{
    display:none;
    position:absolute;
    inset:52px 0 0;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:10;
}

}

.gameOverBox{

    text-align:center;
    background:#0c111d;
    border:1px solid #485675;

}

}

.finalDistance{

.earned{

    color:#39ff70;

/* CONTROLS */

.controls{

.controls button{

    padding:14px;
    border-radius:13px;
    font-weight:900;

/* LEADERBOARD */

.leader{

    padding:12px 7px;

.rank{

.player{

/* FOOTER */

footer{

<script>
"use strict";

/* =====================================================
   STATE
===================================================== */

let token = localStorage.getItem("qaqlil_token");
let currentUser = null;

const $ = id => document.getElementById(id);


/* =====================================================
   API
===================================================== */

async function api(endpoint, options = {}){

    const headers = {
        "Content-Type":"application/json",
        ...(options.headers || {})
    };

    if(token){
        headers.Authorization = "Bearer " + token;
    }

    let response;

    try{

        response = await fetch(endpoint,{
            ...options,
            headers
        });

    }catch(error){

        console.error(error);

        throw new Error(
            "Serverə qoşulmaq mümkün olmadı."
        );
    }

    const contentType =
        response.headers.get("content-type") || "";

    let data = {};

    if(contentType.includes("application/json")){

        data = await response.json().catch(
            () => ({})
        );

    }else{

        const text =
            await response.text().catch(
                () => ""
            );

        data = {
            error:
                text ||
                "Server JSON cavabı göndərmədi."
        };
    }

    if(!response.ok){

        throw new Error(
            data.error ||
            `Server xətası: ${response.status}`
        );
    }

    return data;
}


/* =====================================================
   AUTH UI
===================================================== */

function showError(message){
    $("authError").textContent = message;
}

function clearError(){
    $("authError").textContent = "";
}

function showRegister(){

    $("registerForm").classList.remove("hidden");
    $("loginForm").classList.add("hidden");

    $("registerTab").className = "btn primary";
    $("loginTab").className = "btn secondary";

    clearError();
}

function showLogin(){

    $("registerForm").classList.add("hidden");
    $("loginForm").classList.remove("hidden");

    $("registerTab").className = "btn secondary";
    $("loginTab").className = "btn primary";

    clearError();
}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    clearError();

    const username =
        $("registerUsername").value.trim();

    const code =
        $("registerCode").value.trim();

    if(!/^[A-Za-z0-9_]{3,18}$/.test(username)){

        showError(
            "İstifadəçi adı 3-18 simvol olmalıdır."
        );

        return;
    }

    if(!/^[A-Za-z0-9]{4,10}$/.test(code)){

        showError(
            "Giriş kodu 4-10 hərf və rəqəmdən ibarət olmalıdır."
        );

        return;
    }

    const button = $("registerButton");

    button.disabled = true;
    button.textContent = "YARADILIR...";

    try{

        const data = await api(
            "/api/register",
            {
                method:"POST",
                body:JSON.stringify({
                    username,
                    code
                })
            }
        );

        console.log(
            "REGISTER RESPONSE:",
            data
        );

        if(!data || !data.token){

            throw new Error(
                "Server token göndərmədi."
            );
        }

        token = data.token;

        localStorage.setItem(
            "qaqlil_token",
            token
        );

        await enterGame();

    }catch(error){

        console.error(
            "REGISTER ERROR:",
            error
        );

        showError(error.message);

        button.disabled = false;
        button.textContent = "🚀 HESAB YARAT";
    }
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    clearError();

    const username =
        $("loginUsername").value.trim();

    const code =
        $("loginCode").value.trim();

    if(!/^[A-Za-z0-9_]{3,18}$/.test(username)){

        showError(
            "İstifadəçi adı 3-18 simvol olmalıdır."
        );

        return;
    }

    if(!/^[A-Za-z0-9]{4,10}$/.test(code)){

        showError(
            "Giriş kodu 4-10 hərf və rəqəmdən ibarət olmalıdır."
        );

        return;
    }

    const button = $("loginButton");

    button.disabled = true;
    button.textContent = "DAXİL OLUNUR...";

    try{

        const data = await api(
            "/api/login",
            {
                method:"POST",
                body:JSON.stringify({
                    username,
                    code
                })
            }
        );

        console.log(
            "LOGIN RESPONSE:",
            data
        );

        if(!data || !data.token){

            throw new Error(
                "Server token göndərmədi."
            );
        }

        token = data.token;

        localStorage.setItem(
            "qaqlil_token",
            token
        );

        await enterGame();

    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        showError(error.message);

        button.disabled = false;
        button.textContent = "🔥 DAXİL OL";
    }
}


/* =====================================================
   ENTER GAME
===================================================== */

async function enterGame(){

    try{

        currentUser =
            await api("/api/me");

        if(
            !currentUser ||
            !currentUser.username
        ){

            throw new Error(
                "İstifadəçi məlumatı alınmadı."
            );
        }

        $("authPage")
            .classList
            .add("hidden");

        $("gamePage")
            .classList
            .remove("hidden");

        $("username")
            .textContent =
            currentUser.username;

        $("totalXP")
            .textContent =
            Number(
                currentUser.xp || 0
            ).toLocaleString();

        $("best")
            .textContent =
            Number(
                currentUser.best_distance || 0
            ).toLocaleString();

        await loadLeaderboard();

        restartGame();

    }catch(error){

        console.error(
            "ENTER GAME ERROR:",
            error
        );

        localStorage.removeItem(
            "qaqlil_token"
        );

        token = null;

        throw error;
    }
}


/* =====================================================
   LEADERBOARD
===================================================== */

async function loadLeaderboard(){

    const box = $("leaderboard");

    box.innerHTML =
        "<div class='leader'>Yüklənir...</div>";

    try{

        const data =
            await api(
                "/api/leaderboard"
            );

        box.innerHTML = "";

        if(
            !data ||
            !Array.isArray(data.players) ||
            data.players.length === 0
        ){

            box.innerHTML =
                "<div class='leader'>Hələ heç kim yoxdur.</div>";

            return;
        }

        data.players.forEach(
            (player,index)=>{

                const row =
                    document.createElement("div");

                row.className = "leader";

                if(
                    currentUser &&
                    player.username ===
                    currentUser.username
                ){

                    row.classList.add(
                        "myRank"
                    );
                }

                const rank =
                    document.createElement("span");

                rank.className = "rank";

                rank.textContent =
                    "#" + (index + 1);

                const name =
                    document.createElement("span");

                name.className = "player";

                name.textContent =
                    player.username;

                const xp =
                    document.createElement("span");

                xp.className = "xp";

                xp.textContent =
                    Number(
                        player.xp || 0
                    ).toLocaleString()
                    + " XP";

                row.appendChild(rank);
                row.appendChild(name);
                row.appendChild(xp);

                box.appendChild(row);
            }
        );

    }catch(error){

        console.error(
            "LEADERBOARD ERROR:",
            error
        );

        box.innerHTML =
            "<div class='leader'>Leaderboard yüklənmədi.</div>";
    }
}

===================================================== */

    player.y = groundY - player.height;

    player.onGround = true;

function spawnObstacle(){

        a.x + a.width > b.x &&
        a.y < b.y + b.height &&

}
