<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>QAQLIL RUSH</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 15% 10%,
            #253c9c 0,
            transparent 32%
        ),

        radial-gradient(
            circle at 90% 80%,
            #92145f 0,
            transparent 35%
        ),

        #070a13;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.hidden{
    display:none !important;
}


/* =====================================================
   AUTH
===================================================== */

#authPage{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.authBox{
    width:100%;
    max-width:430px;

    padding:30px;

    text-align:center;

    background:#0c111d;

    border:1px solid #35415e;

    border-radius:25px;

    box-shadow:
        0 25px 80px #000b;
}

.logo{
    font-size:42px;
    font-weight:1000;
    letter-spacing:2px;
}

.logo span,
.headerLogo span{
    color:#39ff70;
}

.subtitle{
    color:#9da8bb;
    margin:8px 0 25px;
}

.authTabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
}

.authTabs button{
    flex:1;
}

input{
    width:100%;

    padding:15px;

    margin:6px 0;

    color:#fff;

    background:#111827;

    border:1px solid #303c58;

    border-radius:13px;

    outline:none;
}

input:focus{
    border-color:#2ddcff;

    box-shadow:
        0 0 0 2px #2ddcff22;
}

.primary{
    background:
        linear-gradient(
            90deg,
            #39ff70,
            #2ddcff
        );

    color:#06100d;

    border:0;
}

.secondary{
    background:#171f2e;

    color:#fff;

    border:1px solid #34405b;
}

.btn{
    width:100%;

    padding:14px;

    margin-top:8px;

    border-radius:13px;

    font-weight:900;
}

#authError{
    min-height:22px;

    margin-top:10px;

    color:#ff5e94;

    font-weight:700;
}


/* =====================================================
   MAIN
===================================================== */

#gamePage{
    width:min(1100px,100%);

    margin:auto;

    padding:12px;
}

header{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:10px;

    margin-bottom:12px;
}

.headerLogo{
    font-size:clamp(27px,6vw,42px);

    font-weight:1000;
}

.userInfo{
    padding:10px 13px;

    border-radius:15px;

    background:#0c1320;

    border:1px solid #303b56;

    font-weight:800;

    font-size:14px;
}

.card{
    background:#0c111d;

    border:1px solid #2d3954;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 18px 50px #0008;
}


/* =====================================================
   GAME
===================================================== */

.gameCard{
    position:relative;
}

.hud{
    height:52px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    background:#090e18;

    font-weight:900;

    font-size:14px;
}

.hud b{
    color:#39ff70;
}

canvas{
    display:block;

    width:100%;

    height:auto;

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;
}


/* =====================================================
   GAME OVER
===================================================== */

#gameOver{
    display:none;

    position:absolute;

    inset:52px 0 0;

    align-items:center;
    justify-content:center;

    background:#000b;

    z-index:10;
}

.gameOverBox{
    width:min(390px,90%);

    padding:28px;

    text-align:center;

    background:#0c111d;

    border:1px solid #485675;

    border-radius:20px;

    box-shadow:
        0 20px 70px #000c;
}

.gameOverBox h1{
    color:#ff4c9a;

    margin-bottom:5px;
}

.finalDistance{
    margin:7px;

    font-size:44px;

    font-weight:1000;

    color:#2ddcff;
}

.earned{
    margin-bottom:18px;

    color:#39ff70;

    font-size:22px;

    font-weight:1000;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
    display:flex;

    gap:10px;

    margin-top:10px;
}

.controls button{
    flex:1;

    padding:14px;

    border-radius:13px;

    font-weight:900;
}


/* =====================================================
   LEADERBOARD
===================================================== */

.leaderCard{
    margin-top:12px;

    padding:15px;
}

.leaderCard h2{
    margin-bottom:10px;
}

.leader{
    display:flex;

    align-items:center;

    gap:10px;

    padding:12px 7px;

    border-bottom:1px solid #20293a;
}

.rank{
    width:30px;

    color:#8f9aae;

    font-weight:900;
}

.player{
    flex:1;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.xp{
    color:#39ff70;

    font-weight:900;

    white-space:nowrap;
}

.myRank{
    background:#123c24;

    border-radius:10px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    padding:25px 5px 12px;

    text-align:center;

    color:#8e99ac;

    font-size:14px;
}

footer a{
    color:#2ddcff;

    font-weight:900;

    text-decoration:none;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .authBox{
        padding:23px;
    }

    .logo{
        font-size:34px;
    }

    .headerLogo{
        font-size:27px;
    }

    .userInfo{
        font-size:12px;
    }

    .hud{
        font-size:11px;
    }

    .controls{
        flex-direction:column;
    }

}

</style>
</head>


<body>

     AUTH PAGE
===================================================== -->

        <div class="logo">

        <div class="authTabs">

            <button

                type="button"
            >

                id="loginTab"

<!-- =====================================================
     GAME PAGE
===================================================== -->

<main
    id="gamePage"
    class="hidden"
>

<header>

    <div class="headerLogo">
        QAQLIL <span>RUSH</span>
    </div>


    <div class="userInfo">

        👤
        <span id="username">

        </span>

<!-- GAME -->

<script>

"use strict";


/* =====================================================
   API CONFIG
===================================================== */

const API_BASE =
    "https://qaqlilrush.azfootball.workers.dev";


/* =====================================================
   GLOBAL
===================================================== */

let token =
    localStorage.getItem(
        "qaqlil_token"
    );

let currentUser =
    null;


const $ =
    id =>
        document.getElementById(id);


/* =====================================================
   API
===================================================== */

async function api(
    endpoint,
    options = {}
){

    const headers = {

        "Content-Type":
            "application/json",

        ...(options.headers || {})

    };


    if(token){

        headers.Authorization =
            "Bearer " + token;

    }


    let response;


    try{

        response =
            await fetch(
                API_BASE + endpoint,
                {
                    ...options,
                    headers
                }
            );

    }catch(error){

        console.error(
            "FETCH ERROR:",
            error
        );

        throw new Error(
            "Serverə qoşulmaq mümkün olmadı."
        );

    }


    const data =
        await response
            .json()
            .catch(
                () => ({})
            );


    if(!response.ok){

        throw new Error(
            data.error ||
            "Server xətası."
        );

    }


    return data;
}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
){

    $("authError")
        .textContent =
        message;

}


function clearError(){

    $("authError")
        .textContent =
        "";

}


/* =====================================================
   AUTH TABS
===================================================== */

function showRegister(){

    $("registerForm")
        .classList
        .remove("hidden");


    $("loginForm")
        .classList
        .add("hidden");


    $("registerTab")
        .className =
        "btn primary";


    $("loginTab")
        .className =
        "btn secondary";


    clearError();
}


function showLogin(){

    $("registerForm")
        .classList
        .add("hidden");


    $("loginForm")
        .classList
        .remove("hidden");


    $("registerTab")
        .className =
        "btn secondary";


    $("loginTab")
        .className =
        "btn primary";


    clearError();
}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    clearError();


    const username =
        $("registerUsername")
            .value
            .trim();


    const code =
        $("registerCode")
            .value
            .trim();


    if(
        !/^[A-Za-z0-9_]{3,18}$/
            .test(username)
    ){

        showError(
            "İstifadəçi adı 3-18 simvol olmalıdır."
        );

        return;
    }


    if(
        !/^[A-Za-z0-9]{4,10}$/
            .test(code)
    ){

        showError(
            "Kod 4-10 hərf və rəqəmdən ibarət olmalıdır."
        );

        return;
    }


    const button =
        $("registerButton");


    button.disabled =
        true;


    button.textContent =
        "YARADILIR...";


    try{

        console.log(
            "REGISTER REQUEST"
        );


        const data =
            await api(
                "/api/register",
                {
                    method:"POST",

                    body:
                        JSON.stringify({
                            username,
                            code
                        })
                }
            );


        console.log(
            "REGISTER RESPONSE:",
            data
        );


        if(
            !data.ok ||
            !data.token
        ){

            throw new Error(
                "Server token göndərmədi."
            );

        }


        token =
            data.token;


        localStorage.setItem(
            "qaqlil_token",
            token
        );


        await enterGame();


    }catch(error){

        console.error(
            "REGISTER ERROR:",
            error
        );


        showError(
            error.message
        );


        button.disabled =
            false;


        button.textContent =
            "🚀 HESAB YARAT";

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    clearError();


    const username =
        $("loginUsername")
            .value
            .trim();


    const code =
        $("loginCode")
            .value
            .trim();


    if(!username){

        showError(
            "İstifadəçi adını yaz."
        );

        return;
    }


    if(!code){

        showError(
            "Giriş kodunu yaz."
        );

        return;
    }


    const button =
        $("loginButton");


    button.disabled =
        true;


    button.textContent =
        "DAXİL OLUNUR...";


    try{

        console.log(
            "LOGIN REQUEST"
        );


        const data =
            await api(
                "/api/login",
                {
                    method:"POST",

                    body:
                        JSON.stringify({
                            username,
                            code
                        })
                }
            );


        console.log(
            "LOGIN RESPONSE:",
            data
        );


        if(
            !data.ok ||
            !data.token
        ){

            throw new Error(
                "Server token göndərmədi."
            );

        }


        token =
            data.token;


        localStorage.setItem(
            "qaqlil_token",
            token
        );


        await enterGame();


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        showError(
            error.message
        );


        button.disabled =
            false;


        button.textContent =
            "🔥 DAXİL OL";

    }

}


/* =====================================================
   ENTER GAME
===================================================== */

async function enterGame(){

    try{

        currentUser =
            await api(
                "/api/me"
            );


        if(!currentUser){

            throw new Error(
                "İstifadəçi məlumatı alınmadı."
            );

        }


        $("authPage")
            .classList
            .add("hidden");


        $("gamePage")
            .classList
            .remove("hidden");


        $("username")
            .textContent =
            currentUser.username;


        $("totalXP")
            .textContent =
            Number(
                currentUser.xp || 0
            ).toLocaleString();


        $("best")
            .textContent =
            Number(
                currentUser.best_distance || 0
            ).toLocaleString();


        await loadLeaderboard();


        restartGame();


    }catch(error){

        console.error(
            "ENTER GAME ERROR:",
            error
        );


        throw error;

    }

}


/* =====================================================
   LEADERBOARD
===================================================== */

async function loadLeaderboard(){

    const box =
        $("leaderboard");


    box.innerHTML =
        "<div class='leader'>Yüklənir...</div>";


    try{

        const data =
            await api(
                "/api/leaderboard"
            );


        box.innerHTML =
            "";


        if(
            !data.players ||
            data.players.length === 0
        ){

            box.innerHTML =
                "<div class='leader'>Hələ heç kim yoxdur.</div>";

            return;
        }


        data.players.forEach(
            (player,index)=>{

                const row =
                    document
                        .createElement(
                            "div"
                        );


                row.className =
                    "leader";


                if(
                    currentUser &&
                    player.username ===
                    currentUser.username
                ){

                    row.classList.add(
                        "myRank"
                    );

                }


                const rank =
                    document.createElement(
                        "span"
                    );


                rank.className =
                    "rank";


                rank.textContent =
                    index + 1;


                const name =
                    document.createElement(
                        "span"
                    );


                name.className =
                    "player";


                name.textContent =
                    player.username;
