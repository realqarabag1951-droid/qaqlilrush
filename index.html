<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;

body{
    min-height:100vh;
    font-family:Arial,sans-serif;

.authBox{

}

.logo{

}

.logo span,

.subtitle{

}

.authTabs{

.authTabs button{

input{

    border:1px solid #303c58;

}

}

.primary{

}

.secondary{

    color:#fff;

.btn{

}

#authError{

    margin-top:10px;
    color:#ff5e94;
}

/* MAIN */

#gamePage{
    width:min(1100px,100%);
    margin:auto;
    padding:12px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.headerLogo{
    font-size:clamp(27px,6vw,42px);
    font-weight:1000;
}

.userInfo{
    padding:10px 13px;
    border-radius:15px;
    background:#0c1320;
    border:1px solid #303b56;
    font-weight:800;
    font-size:14px;
}

.card{
    background:#0c111d;
    border:1px solid #2d3954;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 18px 50px #0008;
}

/* GAME */

.gameCard{
    position:relative;
}

.hud{
    height:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#090e18;
    font-weight:900;
    font-size:14px;
}

.hud b{
    color:#39ff70;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    touch-action:none;
}

/* GAME OVER */

#gameOver{
    display:none;
    position:absolute;
    inset:52px 0 0;
    align-items:center;
    justify-content:center;
    background:#000b;
}

.gameOverBox{
    width:min(390px,90%);
    padding:28px;
    text-align:center;
    background:#0c111d;
    border:1px solid #485675;
    border-radius:20px;
}

.gameOverBox h1{
    color:#ff4c9a;
}

.finalDistance{
    margin:7px;
    font-size:44px;
    font-weight:1000;
    color:#2ddcff;
}

.earned{
    margin-bottom:18px;
    color:#39ff70;
    font-size:22px;
    font-weight:1000;
}

/* CONTROLS */

.controls{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.controls button{
    flex:1;
    padding:14px;
    border-radius:13px;
    font-weight:900;
}

/* LEADERBOARD */

.leaderCard{
    margin-top:12px;
    padding:15px;
}

.leaderCard h2{
    margin-bottom:10px;
}

.leader{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 7px;
    border-bottom:1px solid #20293a;
}

.rank{
    width:30px;
    color:#8f9aae;
    font-weight:900;
}

.player{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
}

.xp{
    color:#39ff70;
    font-weight:900;
}

.myRank{
    background:#123c24;
    border-radius:10px;
}

/* FOOTER */

footer{
    padding:25px 5px 12px;
    text-align:center;
    color:#8e99ac;
    font-size:14px;
}

footer a{

@media(max-width:600px){

<script>

/* =====================================================
                    API SYSTEM
===================================================== */

let token =
    localStorage.getItem(
        "qaqlil_token"
    );

let currentUser = null;


/* API */

async function api(
    endpoint,
    options = {}
){

    const headers = {
        "Content-Type":"application/json",
        ...(options.headers || {})
    };

    if(token){
        headers.Authorization =
            "Bearer " + token;
    }

    const response =
        await fetch(
            endpoint,
            {
                ...options,
                headers
            }
        );

    let data;

    try{
        data =
            await response.json();
    }catch{
        data = {};
    }

    if(!response.ok){

        throw new Error(
            data.error ||
            "Server xətası."
        );

    }

    return data;
}


/* =====================================================
                    REGISTER
===================================================== */

async function register(){

    const username =
        document
        .getElementById(
            "registerUsername"
        )
        .value
        .trim();

    const code =
        document
        .getElementById(
            "registerCode"
        )
        .value
        .trim();


    if(
        !/^[A-Za-z0-9_]{3,18}$/
        .test(username)
    ){

        showError(
            "İstifadəçi adı 3-18 simvol olmalıdır."
        );

        return;
    }


    if(
        !/^[A-Za-z0-9]{4,10}$/
        .test(code)
    ){

        showError(
            "Giriş kodu 4-10 hərf və rəqəm olmalıdır."
        );

        return;
    }


    try{

        const data =
            await api(
                "/api/register",
                {
                    method:"POST",

                    body:JSON.stringify({
                        username,
                        code
                    })
                }
            );


        token =
            data.token;


        localStorage.setItem(
            "qaqlil_token",
            token
        );


        await enterGame();


    }catch(error){

        showError(
            error.message
        );

    }

}


/* =====================================================
                    LOGIN
===================================================== */

async function login(){

    const username =
        document
        .getElementById(
            "loginUsername"
        )
        .value
        .trim();

    const code =
        document
        .getElementById(
            "loginCode"
        )
        .value
        .trim();


    try{

        const data =
            await api(
                "/api/login",
                {
                    method:"POST",

                    body:JSON.stringify({
                        username,
                        code
                    })
                }
            );


        token =
            data.token;


        localStorage.setItem(
            "qaqlil_token",
            token
        );


        await enterGame();


    }catch(error){

        showError(
            error.message
        );

    }

}


/* =====================================================
                    ENTER GAME
===================================================== */

async function enterGame(){

    currentUser =
        await api(
            "/api/me"
        );


    document
        .getElementById(
            "authPage"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "gamePage"
        )
        .classList.remove(
            "hidden"
        );


    updateUserUI();

    await loadLeaderboard();

    restartGame();

}


/* =====================================================
                    UI
===================================================== */

function updateUserUI(){

    if(!currentUser)
        return;


    document
        .getElementById(
            "username"
        )
        .textContent =
        currentUser.username;


    document
        .getElementById(
            "totalXP"
        )
        .textContent =
        Number(
            currentUser.xp
        ).toLocaleString();


    document
        .getElementById(
            "best"
        )
        .textContent =
        Number(
            currentUser.best_distance
        ).toLocaleString();

}


/* =====================================================
                    LEADERBOARD
===================================================== */

async function loadLeaderboard(){

    const container =
        document.getElementById(
            "leaderboard"
        );


    try{

        const data =
            await api(
                "/api/leaderboard"
            );


        container.innerHTML = "";


        if(
            !data.players ||
            data.players.length === 0
        ){

            container.innerHTML =
                "<div class='leader'>Hələ heç kim yoxdur.</div>";

            return;
        }


        data.players.forEach(
            (player,index)=>{

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "leader";


                if(
                    currentUser &&
                    player.username ===
                    currentUser.username
                ){

                    row.classList.add(
                        "myRank"
                    );

                }


                row.innerHTML = `

                    <span class="rank">
                        ${index + 1}
                    </span>

                    <span class="player">
                        ${escapeHTML(
                            player.username
                        )}
                    </span>

                    <span class="xp">
                        ${Number(
                            player.xp
                        ).toLocaleString()}
                        XP
                    </span>

                `;


                container.appendChild(
                    row
                );

            }
        );


    }catch(error){

        container.innerHTML =
            "<div class='leader'>Leaderboard yüklənmədi.</div>";

        console.error(error);

    }

}


/* HTML təhlükəsizliyi */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
                    AUTH UI
===================================================== */

function showRegister(){

    document
        .getElementById(
            "registerForm"
        )
        .classList.remove(
            "hidden"
        );

    document
        .getElementById(
            "loginForm"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "registerTab"
        )
        .className =
        "btn primary";


    document
        .getElementById(
            "loginTab"
        )
        .className =
        "btn secondary";


    clearError();

}


function showLogin(){

    document
        .getElementById(
            "registerForm"
        )
        .classList.add(
            "hidden"
        );

    document
        .getElementById(
            "loginForm"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "registerTab"
        )
        .className =
        "btn secondary";


    document
        .getElementById(
            "loginTab"
        )
        .className =
        "btn primary";


    clearError();

}


function showError(message){

    document
        .getElementById(
            "authError"
        )
        .textContent =
        message;

}


function clearError(){

    document
        .getElementById(
            "authError"
        )
        .textContent =
        "";

}


/* =====================================================
                    GAME
===================================================== */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


let gameRunning = false;

let gameEnded = false;

let lastTime = 0;

let distance = 0;

let runXP = 0;

let speed = 6;

let obstacleTimer = 70;

let obstacles = [];


const groundY = 375;


const player = {

    x:120,

    y:245,

    width:90,

    height:130,

    velocityY:0,

    onGround:true

};


/* =====================================================
                    JUMP
===================================================== */

function jump(){

    if(gameEnded){

        restartGame();

        return;
    }


    if(player.onGround){

        player.velocityY =
            -17;

        player.onGround =
            false;

        if(!gameRunning){

            startGame();

        }

    }

}


/* PC */

window.addEventListener(
    "keydown",
    event=>{

        if(
            event.code === "Space" ||
            event.code === "ArrowUp"
        ){

            event.preventDefault();

            jump();

        }

    }
);


/* PHONE */

document
    .getElementById(
        "jumpButton"
    )
    .addEventListener(
        "pointerdown",
        event=>{

            event.preventDefault();

            jump();

        }
    );


canvas.addEventListener(
    "pointerdown",
    event=>{

        event.preventDefault();

        jump();

    }
);


/* =====================================================
                    START
===================================================== */

function startGame(){

    if(gameRunning)
        return;


    gameRunning =
        true;


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
                    RESTART
===================================================== */

function restartGame(){

    gameRunning =
        false;

    gameEnded =
        false;

    distance =
        0;

    runXP =
        0;

    speed =
        6;

    obstacleTimer =
        70;

    obstacles =
        [];


    player.x =
        120;

    player.y =
        groundY -
        player.height;

    player.velocityY =
        0;

    player.onGround =
        true;


    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "none";


    updateGameUI();

    draw();

    startGame();

}


/* =====================================================
                    OBSTACLE
===================================================== */

function createObstacle(){

    const tall =
        Math.random() < 0.45;


    const width =
        tall
        ? 38
        : 45;


    const height =
        tall
        ? 70 + Math.random()*65
        : 30 + Math.random()*25;


    obstacles.push({

        x:900,

        y:groundY-height,

        width,

        height

    });


    obstacleTimer =
        70 +
        Math.random()*90;

}


/* =====================================================
                    COLLISION
===================================================== */

function collision(a,b){

    const ax =
        a.x + 20;

    const ay =
        a.y + 15;

    const aw =
        a.width - 35;

    const ah =
        a.height - 20;


    return (
        ax < b.x+b.width &&
        ax+aw > b.x &&
        ay < b.y+b.height &&
        ay+ah > b.y
    );

}


/* =====================================================
                    LOOP
====================================
