<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>QAQLIL RUSH</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 15% 10%,
            #253c9c 0,
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 80%,
            #92145f 0,
            transparent 35%
        ),
        #070a13;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================
        AUTH PAGE
========================= */

#authPage{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.authBox{
    width:100%;
    max-width:430px;

    padding:30px;

    text-align:center;

    background:#0c111d;

    border:1px solid #35415e;

    border-radius:25px;

    box-shadow:
        0 25px 80px #000b;
}

.logo{
    font-size:42px;
    font-weight:1000;
    letter-spacing:2px;
}

.logo span,
.headerLogo span{
    color:#39ff70;
}

.subtitle{
    color:#9da8bb;
    margin:8px 0 25px;
}

.authTabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
}

.authTabs button{
    flex:1;
}

input{
    width:100%;

    padding:15px;
    margin:6px 0;

    color:white;

    background:#111827;

    border:1px solid #303c58;

    border-radius:13px;

    outline:none;
}

input:focus{
    border-color:#2ddcff;
}

.btn{
    width:100%;

    padding:14px;

    margin-top:8px;

    border-radius:13px;

    font-weight:900;
}

.primary{
    background:
        linear-gradient(
            90deg,
            #39ff70,
            #2ddcff
        );

    color:#06100d;

    border:0;
}

.secondary{
    background:#171f2e;

    color:#fff;

    border:1px solid #34405b;
}

#authError{
    min-height:22px;

    margin-top:10px;

    color:#ff5e94;

    font-weight:700;
}


/* =========================
        GAME PAGE
========================= */

#gamePage{
    width:min(1100px,100%);

    margin:auto;

    padding:12px;
}

header{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:10px;

    margin-bottom:12px;
}

.headerLogo{
    font-size:clamp(27px,6vw,42px);

    font-weight:1000;
}

.userInfo{
    padding:10px 13px;

    border-radius:15px;

    background:#0c1320;

    border:1px solid #303b56;

    font-weight:800;

    font-size:14px;
}

.card{
    background:#0c111d;

    border:1px solid #2d3954;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 18px 50px #0008;
}


/* =========================
            GAME
========================= */

.gameCard{
    position:relative;
}

.hud{
    height:52px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    background:#090e18;

    font-weight:900;

    font-size:14px;
}

.hud b{
    color:#39ff70;
}

canvas{
    display:block;

    width:100%;
    height:auto;

    touch-action:none;
}


/* =========================
        GAME OVER
========================= */

#gameOver{
    display:none;

    position:absolute;

    inset:52px 0 0;

    align-items:center;
    justify-content:center;

    background:#000b;
}

.gameOverBox{
    width:min(390px,90%);

    padding:28px;

    text-align:center;

    background:#0c111d;

    border:1px solid #485675;

    border-radius:20px;
}

.gameOverBox h1{
    color:#ff4c9a;
}

.finalDistance{
    margin:7px;

    font-size:44px;

    font-weight:1000;

    color:#2ddcff;
}

.earned{
    margin-bottom:18px;

    color:#39ff70;

    font-size:22px;

    font-weight:1000;
}


/* =========================
        CONTROLS
========================= */

.controls{
    display:flex;

    gap:10px;

    margin-top:10px;
}

.controls button{
    flex:1;

    padding:14px;

    border-radius:13px;

    font-weight:900;
}


/* =========================
       LEADERBOARD
========================= */

.leaderCard{
    margin-top:12px;

    padding:15px;
}

.leaderCard h2{
    margin-bottom:10px;
}

.leader{
    display:flex;

    align-items:center;

    gap:10px;

    padding:12px 7px;

    border-bottom:
        1px solid #20293a;
}

.rank{
    width:30px;

    color:#8f9aae;

    font-weight:900;
}

.player{
    flex:1;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.xp{
    color:#39ff70;

    font-weight:900;
}

.myRank{
    background:#123c24;

    border-radius:10px;
}


/* =========================
           FOOTER
========================= */

footer{
    padding:25px 5px 12px;

    text-align:center;

    color:#8e99ac;

    font-size:14px;
}

footer a{
    color:#2ddcff;

    font-weight:900;

    text-decoration:none;
}


/* =========================
          MOBILE
========================= */

@media(max-width:600px){

    .authBox{
        padding:23px;
    }

    .logo{
        font-size:34px;
    }

    .headerLogo{
        font-size:27px;
    }

    .userInfo{
        font-size:12px;
    }

    .hud{
        font-size:11px;
    }

}

</style>
</head>


<body>


<!-- ==================================
             LOGIN / REGISTER
================================== -->

<section id="authPage">

    <div class="authBox">

        <div class="logo">
            QAQLIL <span>RUSH</span>
        </div>

        <div class="subtitle">
            Maneələrdən qaç. Rekordu qır. 🔥
        </div>


        <div class="authTabs">

            <button
                id="registerTab"
                class="btn primary"
                type="button">

                HESAB YARAT

            </button>


            <button
                id="loginTab"
                class="btn secondary"
                type="button">

                DAXİL OL

            </button>

        </div>


        <!-- REGISTER -->

        <div id="registerForm">

            <input
                id="registerUsername"
                type="text"
                maxlength="18"
                autocomplete="off"
                placeholder="İstifadəçi adı">


            <input
                id="registerCode"
                type="password"
                maxlength="10"
                autocomplete="new-password"
                placeholder="Giriş kodu">


            <button
                id="registerButton"
                class="btn primary"
                type="button">

                🚀 HESAB YARAT

            </button>

        </div>


        <!-- LOGIN -->

        <div
            id="loginForm"
            class="hidden">

            <input
                id="loginUsername"
                type="text"
                maxlength="18"
                autocomplete="username"
                placeholder="İstifadəçi adı">


            <input
                id="loginCode"
                type="password"
                maxlength="10"
                autocomplete="current-password"
                placeholder="Giriş kodu">


            <button
                id="loginButton"
                class="btn primary"
                type="button">

                🔥 DAXİL OL

            </button>

        </div>


        <div id="authError"></div>

    </div>

</section>



<!-- ==================================
                 GAME
================================== -->

<main
    id="gamePage"
    class="hidden">


    <header>

        <div class="headerLogo">
            QAQLIL <span>RUSH</span>
        </div>


        <div class="userInfo">

            👤
            <span id="username">
                ---
            </span>

            · ⭐

            <span id="totalXP">
                0
            </span>

            XP

        </div>

    </header>



    <!-- GAME CARD -->

    <div class="card gameCard">


        <div class="hud">

            <span>

                ⭐ RUN XP:

                <b id="runXP">
                    0
                </b>

            </span>


            <span>

                🏆

                <b id="distance">
                    0
                </b>M

                · BEST

                <b id="best">
                    0
                </b>

            </span>

        </div>


        <canvas
            id="gameCanvas"
            width="900"
            height="500">
        </canvas>



        <!-- GAME OVER -->

        <div id="gameOver">

            <div class="gameOverBox">

                <h1>
                    OYUN BİTDİ!
                </h1>


                <div>
                    Məsafə
                </div>


                <div
                    id="finalDistance"
                    class="finalDistance">

                    0 M

                </div>


                <div
                    id="earnedXP"
                    class="earned">

                    +0 XP

                </div>


                <button
                    id="restartButton"
                    class="btn primary"
                    type="button">

                    ↻ RESTART

                </button>

            </div>

        </div>

    </div>



    <!-- CONTROLS -->

    <div class="controls">

        <button
            id="jumpButton"
            class="primary"
            type="button">

            ⬆ TULLAN — SPACE

        </button>


        <button
            id="restartGameButton"
            class="secondary"
            type="button">

            ↻ YENİDƏN

        </button>

    </div>



    <!-- LEADERBOARD -->

    <div class="card leaderCard">

        <h2>
            🌍 XP LİDERLƏRİ
        </h2>


        <div id="leaderboard">

            Yüklənir...

        </div>

    </div>



    <!-- FOOTER -->

    <footer>

        İrad və tənqidlər üçün əlaqə:

        <a
            href="https://www.tiktok.com/@ssamirreds"
            target="_blank"
            rel="noopener noreferrer">

            TikTok — ssamirreds

        </a>

    </footer>


</main>


<!-- ==================================
          JAVASCRIPT FILE
================================== -->

<script src="./app.js"></script>

</body>
</html>
